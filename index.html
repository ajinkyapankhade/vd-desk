<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A81C5E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>VD Enterprise Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F2F5; --surface:#FFFFFF; --surface-2:#F8F7FA; --sunk:#ECEAF0;
  --ink:#1B1A1F; --ink-2:#4A4752; --muted:#6E6A77; --line:#E1DEE6; --line-2:#CFCBD6;
  --accent:#A81C5E; --accent-ink:#FFFFFF; --accent-soft:#F7E3EC; --accent-line:#E7B6CB;
  --fill:#FFF7CF; --fill-line:#E3C640; --fill-focus:#FFEE99;
  --help:#EEF5F0; --help-ink:#2E5A40;
  --good:#1D7A4B; --good-bg:#E2F3EA; --warn:#9A5B00; --warn-bg:#FBEFD9;
  --bad:#C0282D; --bad-bg:#FBE4E4; --info:#2F5DA8; --info-bg:#E4ECF8;
  --s1:#2a78d6; --s2:#eb6834;
  --shadow:0 1px 2px rgba(27,26,31,.06),0 4px 16px rgba(27,26,31,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131217; --surface:#1C1B21; --surface-2:#212027; --sunk:#26242C;
    --ink:#EDEBF1; --ink-2:#C9C5D1; --muted:#9D98A8; --line:#322F3A; --line-2:#433F4D;
    --accent:#EE6FA5; --accent-ink:#1B1A1F; --accent-soft:#3A2230; --accent-line:#6B3450;
    --fill:#2B2716; --fill-line:#7C6A1E; --fill-focus:#3A3417;
    --help:#1C2A22; --help-ink:#9ED3B2;
    --good:#56C891; --good-bg:#16301F; --warn:#E9AE4B; --warn-bg:#352812;
    --bad:#F27575; --bad-bg:#3A1C1E; --info:#8DB2F0; --info-bg:#1B2740;
    --s1:#3987e5; --s2:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --ground:#131217; --surface:#1C1B21; --surface-2:#212027; --sunk:#26242C;
    --ink:#EDEBF1; --ink-2:#C9C5D1; --muted:#9D98A8; --line:#322F3A; --line-2:#433F4D;
    --accent:#EE6FA5; --accent-ink:#1B1A1F; --accent-soft:#3A2230; --accent-line:#6B3450;
    --fill:#2B2716; --fill-line:#7C6A1E; --fill-focus:#3A3417;
    --help:#1C2A22; --help-ink:#9ED3B2;
    --good:#56C891; --good-bg:#16301F; --warn:#E9AE4B; --warn-bg:#352812;
    --bad:#F27575; --bad-bg:#3A1C1E; --info:#8DB2F0; --info-bg:#1B2740;
    --s1:#3987e5; --s2:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 24px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 4px}
.brand svg{flex:none}
.brand b{display:block;font:800 17px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.navgrp{display:flex;flex-direction:column;gap:1px}
.navgrp h6{margin:0 0 4px;padding:0 8px;font:600 10.5px/1.2 var(--f-display);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .tag{margin-left:auto;font:600 10px/1 var(--f-display);letter-spacing:.06em;padding:3px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted)}
.nav[aria-current="page"] .tag{border-color:var(--accent-line);color:var(--accent)}
.conn{margin-top:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;padding:0 8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.dot.on{background:var(--good)} .dot.off{background:var(--bad)}

main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:26px 64px}
.view{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
.head h1{margin:0;font:750 clamp(24px,3vw,32px)/1.05 var(--f-display);font-stretch:115%;letter-spacing:-.005em;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font:600 11px/1 var(--f-display);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:14px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn.primary.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
[hidden]{display:none!important}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 9px;font-size:14.5px;color:var(--ink);font-weight:400;min-width:0}
.inp.fill{background:var(--fill);border-color:var(--fill-line)}
.inp.fill:focus{background:var(--fill-focus)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.search{max-width:280px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h2,.sec-title{margin:0 0 12px;font:700 15px/1.2 var(--f-display);font-stretch:110%;letter-spacing:.01em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:980px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font:600 10.5px/1.2 var(--f-display);font-stretch:112%;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 24px/1.1 var(--f-display);font-stretch:105%;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .s{font-size:12.5px;color:var(--muted)}
.stat.alert .v{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.chip{display:inline-block;font:600 10.5px/1 var(--f-display);letter-spacing:.06em;padding:3px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.gst{border-color:var(--accent-line);color:var(--accent)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font:600 11px/1.2 var(--f-display);font-stretch:108%;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t .n{text-align:right;white-space:nowrap}
table.t td.wrap{min-width:180px;max-width:320px}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-2)}
table.t .inp{padding:4px 6px;font-size:13.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.bad-t{color:var(--bad);font-weight:700}
.good-t{color:var(--good)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.letter{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;align-items:center}
.letter img{width:100%;height:auto;display:block}
.doc-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile b{font:750 17px/1 var(--f-display);font-stretch:118%;letter-spacing:.02em}
.tile span{font-size:13px;color:var(--muted)}
.tile .ser{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;color:var(--ink-2)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);font:700 12px/1 var(--f-display);color:var(--ink)}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.todo li{display:flex;gap:10px;align-items:baseline}
.todo li::before{content:"";flex:none;width:9px;height:9px;border:1.5px solid var(--warn);border-radius:2px;transform:translateY(1px)}
.todo li.ok::before{background:var(--good);border-color:var(--good)}

/* ---------- editor ---------- */
.ed-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(6px);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.state{font-size:13px;color:var(--muted)}
.state b{color:var(--good)}
.fieldset{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.fieldset{grid-template-columns:1fr}}
.docno{font:600 17px/1.2 var(--f-mono)}
.legend-fill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend-fill i{width:14px;height:14px;border-radius:3px;background:var(--fill);border:1px solid var(--fill-line)}
.legend-fill i.h{background:var(--help);border-color:transparent}
.lines-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.lines{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-size:14px}
table.lines th{font:600 10.5px/1.2 var(--f-display);font-stretch:108%;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.lines td{padding:3px 4px;border-bottom:1px solid var(--line);height:38px}
table.lines tr:last-child td{border-bottom:0}
table.lines .inp{padding:5px 7px;font-size:14px;border-radius:4px}
table.lines .h,table.lines th.h{background:var(--help);color:var(--help-ink)}
table.lines th.h{color:var(--help-ink)}
table.lines td.h{font-variant-numeric:tabular-nums;text-align:right;padding-inline:8px;font-size:13px;white-space:nowrap}
table.lines td.h.first,table.lines th.h.first{border-left:2px solid var(--surface)}
table.lines .sr{width:34px;text-align:center;color:var(--muted);font-size:13px}
table.lines .amt{text-align:right;font-variant-numeric:tabular-nums;padding-inline:8px;font-weight:600;white-space:nowrap}
.inp.below{color:var(--bad);font-weight:700;border-color:var(--bad)}
.tot-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:14px;align-items:start}
@media (max-width:860px){.tot-grid{grid-template-columns:1fr}}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-variant-numeric:tabular-nums}
.totals .grand{font:750 22px/1.2 var(--f-display);border-top:1.5px solid var(--ink);padding-top:8px;margin-top:4px}
.words{font-size:13.5px;color:var(--ink-2);font-style:italic}
.margin-box{background:var(--help);color:var(--help-ink);border-radius:10px;padding:14px 16px}
.margin-box h3{margin:0 0 8px;font:700 11px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.margin-box dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.margin-box dd{margin:0;text-align:right;font-weight:700}
.meter{height:6px;border-radius:3px;background:color-mix(in srgb,var(--help-ink) 18%,transparent);margin-top:10px;position:relative;overflow:visible}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--help-ink)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.preview-wrap{overflow:auto;border-radius:10px;background:var(--sunk);padding:20px;display:flex;justify-content:center}
.preview-scale{transform-origin:top left}

/* crop-marked sheet */
.sheet-frame{position:relative;padding:14px}
.sheet-frame::before,.sheet-frame::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--muted);border-style:solid;opacity:.7}
.sheet-frame::before{top:0;left:0;border-width:0 1px 1px 0}
.sheet-frame::after{bottom:0;right:0;border-width:1px 0 0 1px}

/* ---------- paper document (always light, it's paper) ---------- */
.paper{width:794px;min-height:1123px;background:#fff;color:#111;padding:30px 34px;font:12px/1.4 "Source Sans 3","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.paper *{color:inherit}
.paper .lh img{width:100%;display:block}
.paper .addr{display:flex;justify-content:space-between;gap:12px;border-top:2px solid #111;border-bottom:1px solid #bbb;padding:5px 0;font-size:11.5px}
.paper .titleband{display:flex;justify-content:space-between;align-items:baseline}
.paper .titleband h2{margin:0;font:800 24px/1 "Archivo","Arial Narrow",sans-serif;font-stretch:120%;letter-spacing:.06em}
.paper .nogst{font-size:11px;border:1px solid #111;padding:2px 6px;font-weight:600}
.paper .boxes{display:grid;grid-template-columns:1.25fr 1fr;border:1px solid #111}
.paper .boxes>div{padding:7px 9px}
.paper .boxes>div+div{border-left:1px solid #111}
.paper .lbl{font:700 9.5px/1 "Archivo",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:4px}
.paper .client{font-weight:700;font-size:13.5px}
.paper .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.paper .kv b{font-weight:600}
.paper table{width:100%;border-collapse:collapse}
.paper .items{table-layout:fixed}
.paper .items td{overflow-wrap:anywhere;word-break:break-word}
.paper .boxes>div,.paper .addr span,.paper .pay,.paper .lower>div{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.paper .items th{background:#111;color:#fff;font:700 10px/1.2 "Archivo",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:6px 6px;text-align:left}
.paper .items td{padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:top}
.paper .items .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.paper .items .c{text-align:center}
.paper .items tr.fill td{height:22px}
.paper .foot{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
.paper .tt td{padding:3px 6px;font-variant-numeric:tabular-nums}
.paper .tt td:last-child{text-align:right}
.paper .tt tr.g td{border-top:2px solid #111;font:800 15px/1.3 "Archivo",sans-serif;padding-top:6px}
.paper .pay{border:1px solid #111;padding:7px 9px;font-weight:700}
.paper .pay i{display:block;font-weight:400;font-size:11px;margin-top:2px}
.paper .lower{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid #111;padding-top:8px}
.paper ol{margin:0;padding-left:16px}
.paper .sign{margin-top:auto;display:flex;justify-content:flex-end}
.paper .sign div{text-align:center;min-width:220px}
.paper .sign .for{font-weight:700;margin-bottom:46px}
.paper .sign .by{border-top:1px solid #111;padding-top:3px}
.paper .fine{font-size:10px;color:#666;text-align:center}
.sheet-frame{display:flex;flex-direction:column;gap:24px}
.paper.ph{height:1123px;min-height:0;overflow:hidden}
.paper.ph .phhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid #111;padding-bottom:6px;font-size:11.5px}
.paper.ph .phhead b.t{display:block;font:800 18px/1.1 "Archivo",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.paper.ph .phhead .r{text-align:right}
.paper.ph .phgrid{display:grid;gap:12px}
.paper.ph figure{margin:0;border:1px solid #bbb;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.paper.ph .phbox{display:flex;align-items:center;justify-content:center;overflow:hidden}
.paper.ph .phbox img{max-width:100%;width:auto;height:auto;display:block}
.paper.ph .phmiss{color:#888;font-size:12px}
.paper.ph figcaption{font-size:12px;text-align:center;min-height:18px;overflow-wrap:anywhere}
.cam-ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.cam-box{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;width:min(900px,100%)}
.cam-box video{width:100%;max-height:70vh;background:#000;border-radius:10px;object-fit:contain;transition:opacity .15s}
.cam-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.ph-thumbs:empty{display:none}
.ph-t{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.ph-t .im{height:110px;display:flex;align-items:center;justify-content:center;background:var(--sunk);border-radius:6px;overflow:hidden;font-size:12px;color:var(--muted);text-align:center;padding:4px}
.ph-t .im img{max-width:100%;max-height:102px;display:block}
.ph-t .acts{display:flex;gap:4px;align-items:center}

/* ---------- chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:11px var(--f-body);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:170px;z-index:3}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,8,14,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font:750 19px/1.2 var(--f-display);font-stretch:112%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:14px;border-right:0;border-bottom:1px solid var(--line);z-index:10;align-items:center}
  .brand small,.navgrp h6,.conn span{display:none}
  .navgrp{flex-direction:row;gap:2px}
  .nav{white-space:nowrap;padding:6px 9px}
  .nav .tag{display:none}
  .conn{margin:0}
  .ed-bar{top:calc(env(safe-area-inset-top,0px) + 52px)}
}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:border-color .15s,box-shadow .15s,filter .15s}}

#printRoot{display:none}
#pdfStage{position:fixed;left:-12000px;top:0;pointer-events:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app,.toast,.scrim{display:none!important}
  #printRoot{display:block}
  #printRoot .paper{box-shadow:none;width:210mm;min-height:296mm;break-after:page;page-break-after:always}
  #printRoot .paper:last-child{break-after:auto;page-break-after:auto}
  #printRoot .paper.ph{height:296mm;min-height:0}
}
</style>
</head>

  if (!v) return el.dataset.req ? `${fieldName(el)} is needed.` : "";
  return r && r.t ? r.t(v) : "";
}
function markField(el, msg) {
  el.classList.toggle("invalid", !!msg);
  if (msg) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid");
  const lab = el.closest("label.f");
  if (lab) { let m = lab.querySelector(":scope > .vmsg"); if (!m) { m = document.createElement("span"); m.className = "vmsg"; m.setAttribute("role", "alert"); lab.appendChild(m); } m.textContent = msg || ""; }
  else el.title = msg || "";
}
/* Check every field in root. Returns the problems (and marks them red). */
function vCheck(root) {
  const errs = [];
  for (const el of $$("[data-v],[data-req]", root)) {
    if (el.disabled || el.closest("[hidden]")) continue;
    const m = vMsg(el); markField(el, m);
    if (m) errs.push(m.includes(fieldName(el)) ? m : `${fieldName(el)}: ${m}`);
  }
  return errs;
}
function vFail(errs, root) {
  toast(errs[0] + (errs.length > 1 ? `  (+${errs.length - 1} more marked in red)` : ""), true, 7000);
  const f = root && $(".invalid", root); if (f) f.focus();
  return false;
}
/* Clean as you type (capture phase, so every screen's own handlers see the cleaned value) */
document.addEventListener("input", e => {
  const el = e.target, r = el && el.dataset && V[el.dataset.v];
  if (!r) return;
  if (r.f) {
    const old = el.value, nv = r.f(old);
    if (nv !== old) {
      let p = null; try { p = el.selectionStart; } catch {}
      el.value = nv;
      if (p != null) try { const q = Math.max(0, p - (old.length - nv.length)); el.setSelectionRange(q, q); } catch {}
    }
  }
  if (el.classList.contains("invalid") && !el.closest("table.lines")) markField(el, vMsg(el));
}, true);
document.addEventListener("focusout", e => {
  const el = e.target;
  if (!el || !el.dataset || !(el.dataset.v || el.dataset.req) || el.closest("table.lines")) return;
  markField(el, el.value.trim() ? vMsg(el) : (el.classList.contains("invalid") ? vMsg(el) : ""));
}, true);
function clientProblems(c) {

  if (c.pos && !stateCode(c.pos)) p.push("Place of supply isn't a state name.");

}

/* Indian-system amount in words */
function words(n) {
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = x => x < 20 ? a[x] : b[Math.floor(x/10)] + (x%10 ? " " + a[x%10] : "");
  const three = x => (x >= 100 ? a[Math.floor(x/100)] + " Hundred" + (x%100 ? " " : "") : "") + (x%100 ? two(x%100) : "");
  n = Math.round(Math.abs(n));
  if (!n) return "Rupees Zero Only";
  const parts = [];
  const cr = Math.floor(n / 1e7); n %= 1e7;
  const lk = Math.floor(n / 1e5); n %= 1e5;
  const th = Math.floor(n / 1e3); n %= 1e3;
  if (cr) parts.push(three(cr) + " Crore");
  if (lk) parts.push(two(lk) + " Lakh");
  if (th) parts.push(two(th) + " Thousand");
  if (n) parts.push(three(n));
  return "Rupees " + parts.join(" ") + " Only";
}

function rebuildIndex() {

const appDocs = () => S.docs.filter(d => d.source === "app");
function quotes() {
  return appDocs().filter(d => d.kind === "quote").sort((a, b) => (b.date + b.no).localeCompare(a.date + a.no));
}
function pos() {
  return appDocs().filter(d => d.kind === "po").sort((a, b) => (b.date + b.no).localeCompare(a.date + a.no));

function invoices() {
  const today = todayISO(), terms = num(set().defaults.payTerms);
  const recv = new Map();
  for (const p of S.payments) if (p.dir === "Received" && p.against) recv.set(p.against, (recv.get(p.against) || 0) + num(p.amount));
  return appDocs().filter(d => d.kind === "invoice").map(d => {
    const received = recv.get(d.no) || 0;
    const balance = rnd(num(d.total) - received, 0);
    const due = d.due || addDays(d.date, terms);
    const status = balance <= 0 ? "Paid" : received > 0 ? "Part Paid" : today > due ? "Overdue" : "Unpaid";
    const overdue = balance <= 0 ? "" : Math.max(0, daysBetween(due, today));
    return {...d, received, balance, due, status, overdue, margin: num(d.taxable) - num(d.cost)};
  }).sort((a, b) => (b.date + b.no).localeCompare(a.date + a.no));
}

let toastT;
function toast(msg, err, ms) {
  $$(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms || (err ? 6000 : 3500));
}
function modal({title, body, actions}) {
  return new Promise(resolve => {
    const s = document.createElement("div"); s.className = "scrim";
    s.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mbody">${body || ""}</div><div class="row" style="justify-content:flex-end">${actions.map((a, i) => `<button class="btn ${a.cls || ""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div></div>`;
    const close = v => { s.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = e => { if (e.key === "Escape") close(null); };
    s.addEventListener("click", e => {
      if (e.target === s) return close(null);
      const b = e.target.closest("button[data-i]"); if (!b) return;
      const a = actions[+b.dataset.i];
      if (a.collect) { const v = a.collect(s); if (v === false) return; close({value: a.value, data: v}); } else close({value: a.value});
    });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(s);
    const f = s.querySelector("input,select,textarea,button.primary"); if (f) f.focus();
  });
}

    <label class="f" for="lk-item">Item (optional)<input class="inp fill" id="lk-item" list="dl-items" value="${esc(S.lk.item)}" placeholder="e.g. Visiting card" autocomplete="off"></label>
  </div>
  <div id="lk-out"></div>`;
AFTER.lookup = () => {
  const upd = () => { S.lk = {client: $("#lk-client").value, item: $("#lk-item").value}; ls.set("lookup", S.lk); $("#lk-out").innerHTML = lookupOut(); };
  $("#lk-client").addEventListener("input", upd); $("#lk-item").addEventListener("input", upd); upd();
};
function lookupOut() {
  const {client, item} = S.lk, I = S.idx;
  const ci = I.lastCI.get(key(client) + "|" + key(item)), li = I.lastI.get(key(item)), rc = I.rc.get(key(item));
  const bought = I.lines.filter(l => key(l.client) === key(client));
  const owed = invoices().filter(i => key(i.client) === key(client)).reduce((s, i) => s + Math.max(0, i.balance), 0);
  const itemStats = item ? `
    <div class="grid g4">
      <div class="stat"><span class="k">Last rate → this client</span><span class="v">${ci ? "₹" + money(ci.rate) : "no record"}</span><span class="s">${ci ? `${fmtDate(ci.date)} · <span class="mono">${esc(ci.no)}</span>` : "—"}</span></div>
      <div class="stat"><span class="k">Last rate → any client</span><span class="v">${li ? "₹" + money(li.rate) : "no record"}</span><span class="s">${li ? `${esc(li.client)} · ${fmtDate(li.date)}` : "—"}</span></div>
      <div class="stat"><span class="k">Rate Card price</span><span class="v">${rc ? "₹" + money(rc.rate) : "—"}</span><span class="s">${rc ? `per ${esc(rc.unit)}${rc.cost != null && rc.cost !== "" ? ` · cost ₹${money(rc.cost)}` : ""}` : "not on the card"}</span></div>
      <div class="stat"><span class="k">Lowest – highest ever</span><span class="v">${rc && rc.low != null ? `₹${money0(rc.low).slice(1)} – ${money0(rc.high).slice(1)}` : "—"}</span><span class="s">${rc ? `sold ${rc.sold || 0} times${rc.lastSold ? ", last " + fmtDate(rc.lastSold) : ""}` : "—"}</span></div>
    </div>` : "";
  if (!client) return itemStats || `<p class="muted">Pick a client to see everything they've bought.</p>`;
  return `${itemStats}
    <div class="grid g3">
      <div class="stat"><span class="k">Total billed to ${esc(client)}</span><span class="v">${money0(bought.reduce((s, l) => s + l.amount, 0))}</span></div>
      <div class="stat"><span class="k">Line items</span><span class="v">${bought.length}</span></div>
      <div class="stat ${owed > 0 ? "alert" : ""}"><span class="k">Outstanding now</span><span class="v">${money0(owed)}</span>${owed > 0 ? `<span class="s">${waBtn("data-wa-stmt", invoices().find(i => key(i.client) === key(client) && i.balance > 0)?.client || client, "Send statement")}</span>` : ""}</div>
    </div>
    <div><h2 class="sec-title">Everything this client has bought</h2>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th>Doc no.</th><th>Item</th><th class="n">Qty</th><th>Unit</th><th class="n">Rate ₹</th><th class="n">Amount ₹</th></tr></thead><tbody>
    ${bought.length ? bought.map(l => `<tr ${key(l.desc) === key(item) && item ? 'style="background:var(--fill)"' : ""}><td>${fmtDate(l.date)}</td><td class="mono">${esc(l.no)}</td><td class="wrap">${esc(l.desc)}</td><td class="n">${l.qty}</td><td>${esc(l.unit)}</td><td class="n">${money(l.rate)}</td><td class="n">${money(l.amount)}</td></tr>`).join("") : `<tr><td colspan="7" class="empty">No history for this client yet.</td></tr>`}
    </tbody></table></div></div>`;
}
</script>

<script>
"use strict";
/* =====================================================================
   EDITOR — Quote / Invoice / Estimate / Bill
   ===================================================================== */
S.drafts = {};
function blankLine() { return {desc: "", hsn: "", qty: "", unit: "", rate: "", gst: num(set().defaults.gst ?? 0.18)}; }
/* v12.1: a document starts with one line; "+ Add line item" adds more. Fully empty rows are dropped. */
const lineEmpty = l => !["desc", "hsn", "qty", "unit", "rate"].some(f => String(l[f] ?? "").trim());
function compactLines(lines) { const a = (lines || []).filter(l => !lineEmpty(l)).slice(0, LINES); return a.length ? a : [blankLine()]; }
function blankDraft() {
  return {client: "", address: "", gstin: "", pos: "", contact: "", no: "", noAuto: true, date: todayISO(), supply: INTRA,
          vertical: (set().lists.verticals || ["Printing"])[0], ref: "", poNo: "", poDate: "", discount: 0,
          lines: [blankLine()], photos: [], editingId: null, fromId: null, tab: "edit"};
}
function draft(t = S.edType) {
  if (!S.drafts[t]) {
    const saved = ls.get("draft:" + t, null);
    S.drafts[t] = saved && Array.isArray(saved.lines) ? {...blankDraft(), ...saved} : blankDraft();
    S.drafts[t].lines = compactLines(S.drafts[t].lines);
  }
  return S.drafts[t];
}
/* After a document is saved, coming back to its screen starts a blank one with the next number.
   Unsaved work (or a saved one changed since) is kept. */
function draftSig(d) {
  return JSON.stringify([d.client, d.address, d.gstin, d.pos, d.contact, d.no, d.date, d.supply, d.vertical, d.ref, String(d.discount || ""),
    (d.lines || []).filter(l => String(l.desc).trim()).map(l => [l.desc, l.hsn, String(l.qty), l.unit, String(l.rate), String(l.gst)]),
    (d.photos || []).map(p => [p.id, p.cap || ""]), ...(d.poNo || d.poDate ? [d.poNo || "", d.poDate || ""] : [])]);
}
function freshIfSaved(t) {
  const d = draft(t);
  if (d.editingId && d.savedSig && d.savedSig === draftSig(d)) { S.drafts[t] = {...blankDraft(), tab: "edit"}; ls.set("draft:" + t, S.drafts[t]); }
}
const persistDraft = debounce(() => { for (const t in S.drafts) ls.set("draft:" + t, S.drafts[t]); }, 400);
/* Document numbers: the next number skips any number already used (e.g. one picked ahead of time). */
function fmtNo(t, n) { const s = set().series[t] || {}; return (s.prefix || "") + String(n).padStart(3, "0"); }
function noKey(no) {
  no = String(no || "").trim();
  for (const s of Object.values(set().series || {})) {
    const p = s.prefix || "", rest = no.slice(p.length);
    if (p && no.toLowerCase().startsWith(p.toLowerCase()) && /^\d+$/.test(rest)) return (p + Number(rest)).toLowerCase();
  }
  return no.toLowerCase();
}
function usedNo(no, exceptId) { const k = noKey(no); return k ? S.docs.find(x => x.id !== exceptId && noKey(x.no) === k) : null; }
function autoNo(t) {
  let n = num((set().series[t] || {}).next) || 1;
  for (let i = 0; i < 100000 && usedNo(fmtNo(t, n)); i++) n++;
  return fmtNo(t, n);
}
function docNo(t = S.edType) { const d = draft(t); return d.noAuto || !d.no ? autoNo(t) : d.no; }
function lastDate(t, d) { const k = TYPES[t].kind; return addDays(d.date, k === "po" ? 7 : k === "quote" ? num(set().defaults.quoteValidity) : num(set().defaults.payTerms)); }

function compute(t, d) {
  const T = TYPES[t], I = S.idx;
  let sub = 0, gstSum = 0, cost = 0;
  const rows = d.lines.map(l => {
    const has = !!String(l.desc).trim();
    const amount = has ? rnd(num(l.qty) * num(l.rate)) : 0;
    const rc = has ? I.rc.get(key(l.desc)) : null;
    const lc = rc && rc.cost != null && rc.cost !== "" ? num(l.qty) * num(rc.cost) : 0;
    const g = has && T.gst ? rnd(amount * num(l.gst)) : 0;
    sub += amount; gstSum += g; cost += lc;
    return {...l, has, amount, cost: lc, gstAmt: g, rc,
            lastC: has ? I.lastCI.get(key(d.client) + "|" + key(l.desc)) : null,
            lastA: has ? I.lastI.get(key(l.desc)) : null};
  });
  sub = rnd(sub);
  let cgst = 0, sgst = 0, igst = 0, discount = 0, ro, total, taxable, gstAmt;
  if (T.gst) {
    if (d.supply === INTER) igst = rnd(gstSum); else { cgst = rnd(gstSum / 2); sgst = rnd(gstSum / 2); }
    const s = sub + cgst + sgst + igst;
    ro = rnd(Math.round(s) - s); total = rnd(s + ro, 0); taxable = sub; gstAmt = rnd(cgst + sgst + igst);
  } else {
    discount = num(d.discount);
    const s = sub - discount;
    ro = rnd(Math.round(s) - s); total = rnd(s + ro, 0); taxable = rnd(s); gstAmt = 0;
  }
  const margin = sub && cost ? sub - cost : "";
  const target = key(d.vertical) === "solar" ? num(set().defaults.targetSolar) : num(set().defaults.targetPrinting);
  return {rows, sub, cgst, sgst, igst, discount, ro, total, taxable, gstAmt, cost: rnd(cost), margin, marginPct: margin === "" ? "" : margin / sub, target};
}

function docFromDraft(t = S.edType) {
  const d = draft(t), c = compute(t, d), T = TYPES[t];
  const lines = c.rows.filter(r => r.has).map(r => ({desc: r.desc.trim(), hsn: T.gst ? r.hsn : "", qty: num(r.qty), unit: r.unit, rate: num(r.rate), gst: T.gst ? num(r.gst) : 0, amount: r.amount, cost: rnd(r.cost)}));
  const items = lines.map(l => l.desc);
  return {source: "app", kind: T.kind, type: t, docType: T.gst ? "GST" : "Non-GST", no: docNo(t), date: d.date,
    [T.kind === "quote" ? "validUntil" : "due"]: lastDate(t, d),
    client: d.client.trim(), address: d.address, gstin: T.gst ? d.gstin : "", pos: d.pos, contact: T.gst ? "" : d.contact,
    supply: T.gst ? d.supply : "", vertical: d.vertical, ref: T.refLabel ? d.ref : "", discount: c.discount,
    ...(T.kind === "invoice" ? {poNo: String(d.poNo || "").trim(), poDate: d.poDate || ""} : {}),
    lines, subtotal: c.sub, cgst: c.cgst, sgst: c.sgst, igst: c.igst, roundOff: c.ro, total: c.total,
    taxable: c.taxable, gstAmt: c.gstAmt, cost: c.cost,
    photos: (d.photos || []).map(p => ({id: p.id, cap: p.cap || "", f: p.f || photoFileOf(p.id)})),
    summary: items.slice(0, 3).join(", ") + (items.length > 3 ? ` +${items.length - 3} more` : "")};
}

VIEWS.editor = () => {
  const t = S.edType, T = TYPES[t], d = draft(t), L = set().lists;
  const opt = (arr, v) => arr.map(x => `<option ${String(x) === String(v) ? "selected" : ""}>${esc(x)}</option>`).join("");
  const gstOpts = (v) => (L.gstRates || []).map(x => `<option value="${x}" ${num(x) === num(v) ? "selected" : ""}>${Math.round(num(x) * 100)}%</option>`).join("");
  return `
  <div class="head"><div><div class="eyebrow">${T.gst ? "With GST" : "No GST · not a tax invoice"}</div><h1>${esc(T.title === "TAX INVOICE" ? "Tax Invoice" : T.title[0] + T.title.slice(1).toLowerCase())}</h1>
    <p>${T.kind === "quote" ? "Saves into the Quotations log." : T.kind === "po" ? "Saves into the Purchase Orders log. Not counted as a sale." : "Saves into the Invoices log — payments clear the balance."} <span class="legend-fill"><i></i>you type</span> &nbsp; <span class="legend-fill"><i class="h"></i>helpers, never printed</span></p></div></div>
  <div class="ed-bar">
    <div class="seg" role="group" aria-label="View"><button id="tab-edit" aria-pressed="${d.tab !== "preview"}">Edit</button><button id="tab-prev" aria-pressed="${d.tab === "preview"}">Paper preview</button></div>

    ${T.pair ? `<button class="btn" id="ed-copy">Copy → ${T.pair === "INVOICE" ? "Invoice" : "Bill"}</button>` : ""}
    <button class="btn" id="ed-print">Print</button>
    <button class="btn wa" id="ed-wa" title="Send the saved document on WhatsApp (PDF + message)">📲 WhatsApp</button>
    <button class="btn" id="ed-pdf" hidden>Download PDF</button>
    ${d.editingId ? `<button class="btn ghost danger" data-deldoc="${esc(d.editingId)}">Delete</button>` : ""}
    <button class="btn primary" id="ed-save">Save</button>

  <div id="ed-edit" ${d.tab === "preview" ? "hidden" : ""} style="display:flex;flex-direction:column;gap:16px">
    <div class="fieldset">
      <div class="card grid" style="gap:10px">
        <h2 style="margin:0">${T.party ? esc(T.party) : "Bill to"}</h2>
        <label class="f" for="ed-client">${T.party ? esc(T.party) + " name" : "Client"}<input class="inp fill" id="ed-client" data-v="name" list="dl-clients" value="${esc(d.client)}" placeholder="${T.party ? "Type the supplier's name" : "Pick a client, or just type the name"}" autocomplete="off"></label>
        <label class="f" for="ed-address">Billing address<textarea class="inp fill" id="ed-address" rows="2" style="min-height:58px">${esc(d.address)}</textarea></label>
        <div class="grid g2" style="gap:10px">
          ${T.gst ? `<label class="f" for="ed-gstin">Client GSTIN<input class="inp fill mono" id="ed-gstin" data-v="gstin" value="${esc(d.gstin)}" placeholder="27ABCDE1234F1Z5" maxlength="15" autocomplete="off"></label>`
                  : `<label class="f" for="ed-contact">Contact<input class="inp fill" id="ed-contact" value="${esc(d.contact)}" placeholder="Name and phone"></label>`}
          <label class="f" for="ed-pos">Place of supply (state)<input class="inp fill" id="ed-pos" data-v="state" list="dl-states" value="${esc(d.pos)}" placeholder="Maharashtra" autocomplete="off"></label>
        </div>
        <p class="muted" id="ed-gstin-warn" style="margin:0;font-size:13px" hidden></p>
      </div>
      <div class="card grid" style="gap:10px">
        <h2 style="margin:0">Document details</h2>
        <div class="grid g2" style="gap:10px">
          <label class="f" for="ed-no">${esc(T.noLabel)}<input class="inp fill docno" id="ed-no" value="${esc(docNo(t))}"></label>
          <label class="f" for="ed-date">Date<input class="inp fill" type="date" id="ed-date" data-req="1" value="${esc(d.date)}"></label>
          <div class="f"><span>${esc(T.dateLabel)}</span><span class="inp" id="ed-last" style="background:var(--surface-2)"></span></div>
          ${T.gst ? `<label class="f" for="ed-supply">Supply type<select class="inp fill" id="ed-supply">${opt([INTRA, INTER], d.supply)}</select></label>` : ""}
          <label class="f" for="ed-vertical">Vertical<select class="inp fill" id="ed-vertical">${opt(L.verticals || [], d.vertical)}</select></label>
          ${T.refLabel ? `<label class="f" for="ed-ref">${esc(T.refLabel)}<input class="inp fill mono" id="ed-ref" data-v="ref" value="${esc(d.ref)}" list="dl-refs"></label>` : ""}
          ${T.kind === "invoice" ? `<label class="f" for="ed-pono">Client's PO No.<input class="inp fill mono" id="ed-pono" data-v="ref" value="${esc(d.poNo || "")}" placeholder="Their purchase order no." autocomplete="off"></label>
          <label class="f" for="ed-podate">PO Date<input class="inp fill" type="date" id="ed-podate" value="${esc(d.poDate || "")}"></label>` : ""}
        </div>
        <p class="muted" style="margin:0;font-size:12.5px">Want a later number for this one? Type just the number (e.g. <b>10</b>) in ${esc(T.noLabel)}. The normal sequence carries on and skips it when it gets there.</p>
        <p class="bad-t" id="ed-no-warn" style="margin:0;font-size:13px;font-weight:600" hidden></p>
      </div>
    </div>
    <div class="lines-wrap"><table class="lines" id="ed-lines">
      <thead><tr><th class="sr">Sr</th><th style="width:34%">Description of goods / service</th>${T.gst ? `<th style="width:8%">HSN/SAC</th>` : ""}<th style="width:7%">Qty</th><th style="width:8%">Unit</th><th style="width:9%">Rate ₹</th><th style="text-align:right;width:10%">Amount ₹</th><th class="rm" aria-label="Remove line"></th>
      ${T.gst ? `<th class="h first">GST %</th>` : ""}<th class="h ${T.gst ? "" : "first"}" style="text-align:right">Card rate</th><th class="h" style="text-align:right">Last → this client</th><th class="h" style="text-align:right">Last → any</th><th class="h" style="text-align:right">Cost ₹</th></tr></thead>
      <tbody>${d.lines.map((l, i) => `<tr data-row="${i}">
        <td class="sr" id="sr-${i}"></td>

        <td><input class="inp fill num" id="l-rate-${i}" data-f="rate" data-v="rate" inputmode="decimal" aria-label="Rate, line ${i + 1}" value="${esc(l.rate)}"></td>
        <td class="amt" id="amt-${i}"></td>
        <td class="rm"><button class="btn sm ghost" type="button" data-rmline="${i}" title="Remove this line" aria-label="Remove line ${i + 1}">✕</button></td>
        ${T.gst ? `<td class="h first" style="padding:3px 4px"><select class="inp" id="l-gst-${i}" data-f="gst" style="background:transparent;border-color:transparent;min-width:74px">${gstOpts(l.gst)}</select></td>` : ""}
        <td class="h ${T.gst ? "" : "first"}" id="hc-${i}"></td><td class="h" id="hl-${i}"></td><td class="h" id="ha-${i}"></td><td class="h" id="hk-${i}"></td>
      </tr>`).join("")}</tbody></table></div>
    <div class="row" style="gap:10px;margin-top:-6px">${d.lines.length < LINES
      ? `<button class="btn" type="button" id="ed-addline">+ Add line item</button><span class="muted" style="font-size:13px">${d.lines.length} of ${LINES} lines · Enter on the last line adds the next one</span>`
      : `<span class="muted" style="font-size:13px">${LINES} lines — the most that fit on one A4 page.</span>`}</div>
    <div class="checks" id="ed-checks" role="status" aria-live="polite"></div>
    <div class="tot-grid">
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div id="ed-payable" style="font:700 17px/1.3 var(--f-display)"></div>
        <div class="words" id="ed-words"></div>
        <div class="margin-box" id="ed-margin"></div>
      </div>
      <div class="card"><div class="totals" id="ed-totals"></div></div>
    </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">

        <div class="row" style="gap:8px;flex-wrap:wrap">
          <button class="btn" type="button" id="ed-photo-cam">📷 Take photo</button>
          <label class="btn" for="ed-photo-in" style="cursor:pointer">🖼 Choose photos</label>
        </div>
        <input type="file" id="ed-photo-in" accept="image/*" multiple hidden>
        <input type="file" id="ed-photo-cam-in" accept="image/*" capture="environment" hidden>
      </div>
      <div class="ph-thumbs" id="ed-photos"></div>
    </div>
  </div>
  <div id="ed-prev" ${d.tab === "preview" ? "" : "hidden"}><div class="preview-wrap"><div id="prev-box"><div class="preview-scale" id="prev-scale"></div></div></div></div>
  <datalist id="dl-refs">${(T.kind === "invoice" ? quotes().filter(q => q.type === (t === "INVOICE" ? "QUOTE" : "ESTIMATE")) : []).map(q => `<option value="${esc(q.no)}">${esc(q.client)}</option>`).join("")}</datalist>`;
};

AFTER.editor = () => {
  const t = S.edType, d = draft(t);
  const on = (id, ev, fn) => { const el = $("#" + id); if (el) el.addEventListener(ev, fn); };
  on("ed-client", "input", e => { d.client = e.target.value; applyClient(false); touch(); });
  on("ed-client", "change", () => applyClient(true));
  on("ed-address", "input", e => { d.address = e.target.value; touch(); });
  on("ed-gstin", "input", e => {
    d.gstin = e.target.value.toUpperCase(); e.target.value = d.gstin;
    if (d.gstin.length === 15 && !gstinProblem(d.gstin) && !String(d.pos).trim()) { d.pos = stateName(d.gstin.slice(0, 2)); const p = $("#ed-pos"); if (p) p.value = d.pos; autoSupply(); }
    touch();
  });
  on("ed-contact", "input", e => { d.contact = e.target.value; touch(); });
  on("ed-pos", "input", e => { d.pos = e.target.value; autoSupply(); touch(); });
  on("ed-pos", "change", e => { const c = stateCode(e.target.value); if (c) { d.pos = stateName(c); e.target.value = d.pos; autoSupply(); touch(); } });
  on("ed-no", "input", e => { d.no = e.target.value; d.noAuto = e.target.value.trim() === autoNo(t) || !e.target.value.trim(); touch(); });
  on("ed-no", "change", e => {
    const v = e.target.value.trim();
    if (/^\d+$/.test(v) && Number(v) > 0 && (set().series[t] || {}).prefix) { d.no = fmtNo(t, Number(v)); e.target.value = d.no; d.noAuto = d.no === autoNo(t); touch(); }
  });
  on("ed-date", "input", e => { d.date = e.target.value || todayISO(); touch(); });
  on("ed-supply", "change", e => { d.supply = e.target.value; touch(); });
  on("ed-vertical", "change", e => { d.vertical = e.target.value; touch(); });

/* Supply type follows the place of supply: same state as ours → CGST+SGST, another state → IGST */

/* Everything wrong with the document on screen: {errs (block Save), warns (shown only), cells (line → field → message)} */
function editorChecks(t, d) {
  const T = TYPES[t], errs = [], warns = [], cells = {};
  if (T.gst && String(d.gstin || "").trim()) { const p = gstinProblem(d.gstin); if (p) errs.push(`${T.party ? "Supplier" : "Client"} GSTIN: ${p}`); }
  if (String(d.pos || "").trim() && !stateCode(d.pos)) errs.push("Place of supply: pick the state from the list.");
  if (!d.date) errs.push("The date is missing.");
  if (T.kind === "invoice") {
    if (d.poDate && !String(d.poNo || "").trim()) errs.push("PO date is filled in but the client's PO number is blank.");
    if (d.poDate && d.date && d.poDate > d.date) errs.push(`The client's PO date (${fmtDate(d.poDate)}) is after this ${T.title === "BILL" ? "bill" : "invoice"}'s date.`);
  }
  if (T.gst) {
    const pc = stateCode(d.pos);
    if (pc && (pc === ownStateCode()) !== (d.supply !== INTER)) warns.push(`Place of supply is ${stateName(pc)} but the supply type is ${d.supply === INTER ? "Inter-State" : "Intra-State"} — check it.`);
  }
  let sr = 0, sub = 0, noHsn = 0;
  d.lines.forEach((l, i) => {
    const has = !!String(l.desc).trim(), q = String(l.qty ?? "").trim(), r = String(l.rate ?? "").trim(), h = T.gst ? String(l.hsn ?? "").trim() : "";
    if (!has) { if (q || r || h) errs.push(`Row ${i + 1} has a ${q ? "qty" : r ? "rate" : "HSN"} but no description.`); return; }
    sr++;
    const c = {};
    if (!q) c.qty = "Qty is missing."; else if (V.qty.t(q)) c.qty = V.qty.t(q);
    if (!r) c.rate = "Rate is missing."; else if (V.rate.t(r)) c.rate = V.rate.t(r);
    if (h && V.hsn.t(h)) c.hsn = V.hsn.t(h);
    if (T.gst && !h) noHsn++;
    for (const f in c) errs.push(`Line ${sr}: ${c[f]}`);

  if (!T.gst) {
    const dv = String(d.discount ?? "").trim();
    if (dv && dv !== "0" && V.rate.t(dv)) errs.push("Discount must be a number.");

}

function recalc() {

    $("#hk-" + i).textContent = r.has ? (r.cost ? money(r.cost) : "0.00") : "";
    const below = r.has && r.lastC && String(r.rate).trim() !== "" && num(r.rate) < r.lastC.rate;
    const rateEl = $("#l-rate-" + i);
    rateEl.classList.toggle("below", !!below);
    const cc = chk.cells[i] || {};
    for (const f of ["qty", "rate", "hsn"]) { const el = $(`#l-${f}-${i}`); if (!el) continue; el.classList.toggle("invalid", !!cc[f]); if (cc[f]) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid"); if (f !== "rate") el.title = cc[f] || ""; }
    rateEl.title = [cc.rate, below ? `Below the ₹${money(r.lastC.rate)} this client paid on ${fmtDate(r.lastC.date)}` : ""].filter(Boolean).join(" · ");
  });
  const ck = $("#ed-checks");
  if (ck) ck.innerHTML = chk.errs.map(x => `<div class="e">✕ ${esc(x)}</div>`).join("") + chk.warns.map(x => `<div class="w">! ${esc(x)}</div>`).join("");
  $("#ed-last").textContent = fmtDate(lastDate(t, d));
  const tot = T.gst
    ? [["Sub total", c.sub], ["CGST", c.cgst], ["SGST", c.sgst], ["IGST", c.igst], ["Round off", c.ro]]

    + `<span class="grand">${T.gst ? "Grand total" : "Total"}</span><span class="grand num">₹${money(c.total)}</span>`;
  const disc = $("#ed-disc");
  if (disc) { disc.addEventListener("input", e => { d.discount = e.target.value; persistDraft(); recalcSoon(); }); if (S.keepDisc) { disc.focus(); disc.setSelectionRange(disc.value.length, disc.value.length); } }

  $("#ed-words").textContent = words(c.total);

    ${has ? "" : `<p style="margin:10px 0 0;font-size:12.5px">Add Cost on the Rate Card to see margin here.</p>`}`;
  const w = $("#ed-gstin-warn");

async function saveDoc() {
  const t = S.edType, T = TYPES[t], d = draft(t);
  if (!d.client.trim()) { toast("Type or pick a client first.", true); $("#ed-client")?.focus(); return; }
  const body = docFromDraft(t);
  if (!body.lines.length) { toast("Add at least one line item first.", true); $("#l-desc-0")?.focus(); return; }
  if (!body.no.trim()) { toast("Give the document a number.", true); return; }
  const chk = editorChecks(t, d);
  if (chk.errs.length) { setTab("edit"); return vFail(chk.errs, $("#ed-edit")); }
  if (body.pos) { const pc = stateCode(body.pos); if (pc) body.pos = stateName(pc); }
  const id = safeId(body.no);
  const log = T.kind === "quote" ? "Quotations" : T.kind === "po" ? "Purchase Orders" : "Invoices";
  const clash = usedNo(body.no, d.editingId) || (S.docs.find(x => x.id === id && x.id !== d.editingId));
  if (clash) {
    await modal({title: "Number already used", body: `<p style="margin:0"><span class="mono">${esc(body.no)}</span> is already used (${esc(clash.client || "—")}, ${esc(fmtDate(clash.date))}, ${money0(clash.total)}). A number can only be used once — type a different number.</p>`, actions: [{label: "OK", value: true, cls: "primary"}]});
    $("#ed-no")?.focus(); return;
  }
  const keep = (d.editingId && S.docs.find(x => x.id === d.editingId)) || {};
  if (t === "INVOICE" && !(d.savedSig && draftSig(d) === d.savedSig)) {   // GSTR-1 already filed for this month?
    const was = keep.id && ymOf(keep.date) !== ymOf(body.date) ? keep : null;
    if (!(await gstFiledGuard({...body, type: t}, "save"))) return;
    if (was && !(await gstFiledGuard(was, "save"))) return;
  }
  body.savedAt = new Date().toISOString();
  body.notes = keep.notes || "";
  if (T.kind === "quote") { body.status = keep.status || "Sent"; body.converted = keep.converted || ""; body.followUp = keep.followUp || ""; }
  if (T.kind === "po") body.status = keep.status || "Sent";
  const isNew = !d.editingId;
  const btn = $("#ed-save"); if (btn) btn.disabled = true;
  const ok = await write(async db => {
    await db.doc("docs/" + id).set(body);
    if (d.editingId && d.editingId !== id) await db.doc("docs/" + d.editingId).delete();
    const s = set().series[t] || {};
    const tail = body.no.startsWith(s.prefix || "") ? body.no.slice((s.prefix || "").length) : "";
    if (/^\d+$/.test(tail) && Number(tail) === num(s.next)) {           // the regular next number was used → move on to the next free one
      let n = Number(tail) + 1; while (usedNo(fmtNo(t, n))) n++;
      await db.doc("config/settings").update({series: {[t]: {prefix: s.prefix || "", next: n}}});
    }
    if (d.fromId) { const q = S.docs.find(x => x.id === d.fromId); if (q) await db.doc("docs/" + d.fromId).update({status: "Invoiced", converted: body.no}); }
    if (isNew && T.kind === "invoice") {
      for (const l of body.lines) {
        const rc = S.idx.rc.get(key(l.desc)); if (!rc) continue;
        await db.doc("ratecard/" + rc.id).update({sold: num(rc.sold) + 1, lastSold: (rc.lastSold || "") > body.date ? rc.lastSold : body.date,
          low: rc.low == null ? l.rate : Math.min(num(rc.low), l.rate), high: rc.high == null ? l.rate : Math.max(num(rc.high), l.rate)});
      }
    }
  });
  if (btn) btn.disabled = false;
  if (!ok) return;
  d.editingId = id; d.no = body.no; d.noAuto = false; d.fromId = null; d.savedSig = draftSig(d);
  persistDraft(); recalc();
  if (isNew && !$("[data-deldoc]", $("#main") || document)) { const sv = $("#ed-save"); if (sv) sv.insertAdjacentHTML("beforebegin", `<button class="btn ghost danger" data-deldoc="${esc(id)}">Delete</button>`); }
  toast(`Saved ${body.no} to ${log}.${isNew ? " Next number is ready — press New for the next one." : ""}`);
}

function photoFileOf(pid) {
  for (const r of Object.values(L.coll.docs || {})) for (const p of (r && r.photos) || []) if (p.id === pid && p.f) return p.f;
  return "";
}
async function imgGet(id, f) {
  if (S.img[id]) return false;
  let u = await kv.get("img:" + id);
  if (!u && f && navigator.onLine && tokenOk()) { try { u = await driveDownload(f); if (u) await kv.set("img:" + id, u); } catch {} }
  if (u) { S.img[id] = u; return true; }

}
async function ensureImgs(doc) {

}
function shrinkImage(file, maxSide) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = maxSide || 1600, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.naturalWidth * k)); cv.height = Math.max(1, Math.round(im.naturalHeight * k));
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("not an image")); };
    im.src = url;
  });
}
/* Live camera window for computers with a webcam. onShot(blob) is called for every photo taken. */
async function openCamera(onShot, opts = {}) {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1920}, height: {ideal: 1080}}, audio: false}); }
  catch (e) {
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    toast(denied ? "Camera permission was refused — click the camera icon in the address bar to allow it, then try again." : "No camera found on this computer — use Choose photos instead.", true);
    return;
  }
  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "cam-ov";
    ov.innerHTML = `<div class="cam-box" role="dialog" aria-label="Camera">
      <video playsinline autoplay muted></video>
      <div class="cam-acts"><span class="muted" id="cam-count" style="flex:1;font-size:13px">${esc(opts.hint || "Point the camera at the product and press Take photo.")}</span>
        <button class="btn ghost" type="button" data-x>Done</button><button class="btn primary" type="button" data-snap>📷 Take photo</button></div></div>`;
    document.body.appendChild(ov);
    const v = ov.querySelector("video"); v.srcObject = stream;
    const onKey = e => { if (e.key === "Escape") close(); };
    function close() { stream.getTracks().forEach(t => t.stop()); ov.remove(); document.removeEventListener("keydown", onKey); resolve(); }
    document.addEventListener("keydown", onKey);
    ov.querySelector("[data-x]").onclick = close;
    ov.querySelector("[data-snap]").onclick = () => {
      if (!v.videoWidth) return;
      const cv = document.createElement("canvas"); cv.width = v.videoWidth; cv.height = v.videoHeight;
      cv.getContext("2d").drawImage(v, 0, 0);
      v.style.opacity = ".3"; setTimeout(() => { v.style.opacity = ""; }, 150);
      cv.toBlob(async b => {
        if (!b) return;
        const n = await onShot(b);
        if (opts.single) return close();
        const c = ov.querySelector("#cam-count"); if (c) c.textContent = `${n} photo${n > 1 ? "s" : ""} added — take another or press Done.`;
      }, "image/jpeg", 0.92);
    };
  });
}

function photoPages(doc) {

function loadScript(src) {

/* Any set of .paper pages → one A4 PDF (Blob) */
async function htmlToPdfBlob(html) {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const stage = $("#pdfStage");
  stage.innerHTML = html;
  try {
    const pages = Array.from(stage.children);
    await Promise.all([document.fonts ? document.fonts.ready : 0, ...$$("img", stage).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))]);

    }

  } finally { stage.innerHTML = ""; }
}

<script>

/* Delete a saved quotation / invoice / bill / purchase order (from the lists or the editor) */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-deldoc]"); if (!b) return;
  e.preventDefault();
  const doc = S.docs.find(x => x.id === b.dataset.deldoc); if (!doc) return toast("That document is already gone.", true);
  if (!(await gstFiledGuard(doc, "delete"))) return;
  const paid = S.payments.filter(p => p.against && p.against === doc.no);
  const paidAmt = paid.reduce((s, p) => s + num(p.amount), 0);
  const extra = paid.length ? `<br><br><b>${paid.length} payment${paid.length > 1 ? "s" : ""} (${money0(paidAmt)})</b> recorded against it will stay on the Payments page — delete ${paid.length > 1 ? "those" : "that"} there too if ${paid.length > 1 ? "they were" : "it was"} wrong.` : "";
  if (!(await confirmBox(`Delete ${doc.no}?`, `This removes <span class="mono">${esc(doc.no)}</span> (${esc(doc.client || "—")}, ${money0(doc.total)}) from this device and, after the next sync, from Google and every other device. It can't be undone.${extra}`, "Delete it", true))) return;
  const ok = await write(db => db.doc("docs/" + doc.id).delete(), `Deleted ${doc.no}.`);
  if (!ok) return;
  for (const t in S.drafts) if (S.drafts[t].editingId === doc.id) S.drafts[t] = {...blankDraft(), tab: "edit"};
  persistDraft();
  if (S.view === "editor") render();
});

    <label class="f" for="${pre}amount">Amount ₹<input class="inp fill num" id="${pre}amount" data-v="money" data-req="1" inputmode="decimal" value="${esc(p.amount ?? "")}"></label>

    <label class="f" for="${pre}ref">Ref / UTR<input class="inp fill mono" id="${pre}ref" data-v="ref" value="${esc(p.ref || "")}"></label>
    <label class="f" for="${pre}notes" style="grid-column:1/-1">Notes<input class="inp fill" id="${pre}notes" value="${esc(p.notes || "")}"></label>
  </div>`;
}
function bindPayFields(root, pre) {
  const ag = $("#" + pre + "against", root);
  ag.addEventListener("change", () => {
    const inv = S.idx.invByNo.get(ag.value.trim()); if (!inv) return;
    if (!$("#" + pre + "party", root).value) $("#" + pre + "party", root).value = inv.client;
    if (!$("#" + pre + "amount", root).value && inv.balance > 0) $("#" + pre + "amount", root).value = inv.balance;
  });
}
function readPay(root, pre) {
  const g = n => $("#" + pre + n, root).value.trim();
  const errs = vCheck(root); if (errs.length) return vFail(errs, root);
  const p = {date: g("date") || todayISO(), dir: g("dir"), against: g("against"), party: g("party"), amount: num(g("amount")), mode: g("mode"), account: g("account"), ref: g("ref"), notes: g("notes")};
  if (!p.amount) { toast("Enter the amount.", true); return false; }
  if (p.date > todayISO()) { toast("The payment date is in the future — check it.", true); return false; }
  if (!p.party && !p.against) { toast("Enter who paid, or the document it's against.", true); return false; }
  return p;
}
async function addPayment(p) {
  const inv = p.against ? S.idx.invByNo.get(p.against) : null;
  const ok = await write(db => db.collection("payments").add({...p, createdAt: new Date().toISOString()}), `Payment of ${money0(p.amount)} recorded.`);
  if (ok && p.dir === "Received" && p.against && !inv) toast(`Recorded — but ${p.against} isn't one of the saved invoices, so no invoice balance changed.`, true, 8000);
  else if (ok && inv && p.dir === "Received" && p.amount > inv.balance + 0.5) toast(`Recorded — that's ${money0(p.amount - inv.balance)} more than ${inv.no}'s balance.`, true, 8000);
  return ok;
}

});

/* Supplier GSTIN for an expense: typed on the expense (v14), else from the matching Client */
function expGstin(x) {
  const g = String(x.gstin || "").trim().toUpperCase();
  if (g && !gstinProblem(g)) return g;
  const c = S.idx.client.get(key(x.vendor));
  return c && c.gstin && !gstinProblem(c.gstin) ? String(c.gstin).toUpperCase() : "";
}
/* GST of an expense split into IGST or CGST+SGST by the supplier's state */
function expSplit(x) {
  const t = num(x.gstAmt), g = expGstin(x), inter = !!g && g.slice(0, 2) !== ownStateCode();
  return {gstin: g, igst: inter ? t : 0, cgst: inter ? 0 : rnd(t / 2), sgst: inter ? 0 : rnd(t - rnd(t / 2))};
}
function expenseFields(x, pre) {

      <label class="f" for="${pre}vendor">Paid to / supplier<input class="inp fill" id="${pre}vendor" list="dl-clients" autocomplete="off" value="${esc(x.vendor || "")}"></label>
      <label class="f" for="${pre}gstin">Supplier GSTIN<input class="inp fill mono" id="${pre}gstin" data-v="gstin" maxlength="15" autocomplete="off" placeholder="from their bill" value="${esc(x.gstin || "")}"></label>

      <label class="f" for="${pre}linked">Linked job / invoice<input class="inp fill mono" id="${pre}linked" list="dl-invnos" value="${esc(x.linked || "")}"></label>
      <label class="f" for="${pre}notes" style="grid-column:span 3">Notes<input class="inp fill" id="${pre}notes" value="${esc(x.notes || "")}"></label>

/* Wire one expense form: GSTIN from the supplier on Clients, live GST split. Returns a reader for the values. */
function wireExpenseForm(root, pre, keepGst) {
  const q = id => $("#" + pre + id, root);
  const showSplit = () => {
    const a = num(q("amount").value), g = num(q("gst").value), s = keepGst && a === num(keepGst.amount) && g === num(keepGst.gst) ? {gstAmt: num(keepGst.gstAmt), basic: num(keepGst.basic)} : splitGst(a, g);
    const sp = expSplit({gstAmt: s.gstAmt, gstin: q("gstin").value, vendor: q("vendor").value});
    q("split").textContent = !a ? "" : !s.gstAmt ? `No GST · basic ₹${money(s.basic)}`
      : `GST ₹${money(s.gstAmt)} = ${sp.igst ? `IGST ₹${money(sp.igst)}` : `CGST ₹${money(sp.cgst)} + SGST ₹${money(sp.sgst)}`} · basic ₹${money(s.basic)}${sp.gstin ? "" : " · no supplier GSTIN → no input credit"}`;
  };
  q("vendor").addEventListener("change", () => {
    const c = S.idx.client.get(key(q("vendor").value));
    if (c && c.gstin && !q("gstin").value.trim()) { q("gstin").value = c.gstin; markField(q("gstin"), ""); }
    showSplit();
  });
  for (const id of ["amount", "gst", "gstin", "vendor"]) q(id).addEventListener("input", showSplit);
  showSplit();
  return () => {
    const g = id => q(id).value.trim();
    const errs = vCheck(root); if (errs.length) { vFail(errs, root); return null; }
    const amount = num(g("amount")), gst = num(g("gst"));
    if (!amount) { toast("Enter the amount.", true); return null; }

function fyOf(iso) { const [y, m] = iso.split("-").map(Number); return m >= 4 ? y : y - 1; }

function dashData(fy) {
  const inv = invoices(), start = `${fy}-04-01`, end = `${fy + 1}-04-01`;
  const months = Array.from({length: 12}, (_, k) => {
    const y = fy + (k >= 9 ? 1 : 0), m = ((k + 3) % 12) + 1;
    const p = `${y}-${String(m).padStart(2, "0")}`;
    const I = inv.filter(i => (i.date || "").startsWith(p)), E = S.expenses.filter(x => (x.date || "").startsWith(p));
    const sum = (a, f) => a.reduce((s, x) => s + num(f(x)), 0);
    const sales = sum(I, i => i.taxable), gst = sum(I, i => i.gstAmt), exp = sum(E, x => x.basic), gstPaid = sum(E, x => x.gstAmt);
    return {label: `${MON[m - 1]} ${String(y).slice(2)}`, sales, gst, total: sales + gst, exp, gstPaid, profit: sales - exp,
      gstSales: sum(I.filter(i => i.docType === "GST"), i => i.taxable), nonGst: sum(I.filter(i => i.docType === "Non-GST"), i => i.taxable),
      collected: sum(S.payments.filter(x => x.dir === "Received" && (x.date || "").startsWith(p)), x => x.amount), count: I.length};
  });
  const q = quotes().filter(x => x.date >= start && x.date < end);
  return {months, q, inv, start, end};
}

function niceMax(v) { if (v <= 0) return 1000; const p = 10 ** Math.floor(Math.log10(v)); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * p >= v) return k * p; return 10 * p; }

    {label: "Cancel", value: false, cls: "ghost"}, {label: r.id ? "Save changes" : "Add item", value: true, cls: "primary", collect: s => {

/* =====================================================================
   WHATSAPP (v12) — invoice / quote / PO PDFs, client statements,

   Phones: "Share PDF" opens the share menu → WhatsApp → contact (PDF + message).
   Computers: "Open WhatsApp chat" opens the chat with the message typed in
   and downloads the PDF to attach with 📎.
   ===================================================================== */
const DOCNAME = {QUOTE: "Quotation", INVOICE: "Tax Invoice", ESTIMATE: "Estimate", BILL: "Bill", PO: "Purchase Order"};
const waBtn = (attr, val, label = "WhatsApp") => `<button class="btn sm ghost wa" type="button" ${attr}="${esc(val)}" title="Send on WhatsApp">📲${label ? " " + esc(label) : ""}</button>`;
const clientOf = name => S.idx.client.get(key(name)) || null;
function waNo(v) { return findPhones([String(v || "")]).mob[0] || ""; }
function partyPhone(name, extra) { return waNo(clientOf(name)?.phone) || waNo(extra); }
function payDetailsText() {
  const c = set().company, p = [];
  if (c.upi) p.push(`UPI: ${c.upi}`);
  if (c.bank || c.acNo) p.push(`Bank: ${[c.bank, c.acNo && "A/c " + c.acNo, c.ifsc && "IFSC " + c.ifsc].filter(Boolean).join(", ")}`);
  return p.join("\n");
}
function signOff() { const c = set().company; return ["Thank you,", c.name || "VD Enterprise", c.phone].filter(Boolean).join("\n"); }
const pendingInvoices = name => invoices().filter(i => i.balance > 0 && (!name || key(i.client) === key(name))).sort((a, b) => (a.date + a.no).localeCompare(b.date + b.no));

function docMessage(doc) {
  const T = TYPES[doc.type], nm = DOCNAME[doc.type] || T.title, L = [`Dear ${doc.client},`, ""];
  const amt = `*₹${money(doc.total)}*${T.gst ? " (incl. GST)" : ""}`;
  if (T.kind === "invoice") {
    const inv = invoices().find(i => i.id === doc.id) || {...doc, balance: num(doc.total), received: 0, status: "", due: doc.due};
    if (inv.status === "Overdue") L.push(`This is a gentle reminder that our ${nm} *${doc.no}* dated ${fmtDate(doc.date)} is overdue by ${inv.overdue} day${inv.overdue === 1 ? "" : "s"}.`);
    else L.push(`Please find our ${nm} *${doc.no}* dated ${fmtDate(doc.date)}${doc.summary ? ` for ${doc.summary}` : ""}.`);
    if (doc.poNo) L.push(`Your PO: ${doc.poNo}${doc.poDate ? ` dated ${fmtDate(doc.poDate)}` : ""}`);
    L.push(`Amount: ${amt}`);
    if (inv.balance <= 0) L.push("Received in full — thank you!");
    else {
      if (inv.received > 0) L.push(`Received: ₹${money(inv.received)} · *Balance: ₹${money(inv.balance)}*`);
      if (inv.due) L.push(`Due date: ${fmtDate(inv.due)}`);
      const p = payDetailsText(); if (p) L.push("", "Payment details:", p);
    }
  } else if (T.kind === "quote") {
    L.push(`Please find our ${nm} *${doc.no}* dated ${fmtDate(doc.date)}${doc.summary ? ` for ${doc.summary}` : ""}.`, `Amount: ${amt}`);
    if (doc.validUntil) L.push(`Valid until: ${fmtDate(doc.validUntil)}`);
    L.push("", "Please confirm and we'll go ahead.");
  } else {
    L.push(`Please find our Purchase Order *${doc.no}* dated ${fmtDate(doc.date)}.`, `PO value: ${amt}`);
    if (doc.due) L.push(`Please deliver by ${fmtDate(doc.due)}.`);
    L.push("Please mention our PO number on your invoice and delivery challan.");
  }
  L.push("", signOff());
  return L.join("\n");

function findGstins(text) {

    const z = line.replace(/[^A-Z0-9]/g, "");
    for (let i = 0; i + 15 <= z.length; i++) {
      const w = z.slice(i, i + 15).split("");
      for (const k of [0, 1, 7, 8, 9, 10]) w[k] = toD[w[k]] || w[k];
      for (const k of [2, 3, 4, 5, 6, 11]) w[k] = toA[w[k]] || w[k];

      let acc = "";

      const l = lines[i];
      if (i > a0 && !(addrLike(l) || /,\s*$/.test(lines[i - 1]) || /^[A-Za-z .,\-\/0-9]+,/.test(l))) break;
      if (i > a0 && (contacty(l) && !addrLike(l))) break;
      const c = cleanAddr(l); if (c) parts.push(c);
      used.add(i);
      if (/\b[1-9]\d{2}\s?\d{3}\b/.test(l)) break;     // the PIN code ends the address
    }
    out.address = parts.join(", ").replace(/,\s*,/g, ",").replace(/\s{2,}/g, " ");
  }
  // Contact person: "Mr. …", or a name next to a designation
  const nameish = l => { const w = l.replace(/^(mr|mrs|ms|miss|dr|shri|smt|er|ca|adv|prof)\.?\s+/i, "").split(/\s+/); return w.length >= 2 && w.length <= 4 && w.every(x => /^[A-Za-z][A-Za-z.'\-]*$/.test(x)) && !BIZ_RE.test(l) && !ADDR_RE.test(l) && !CITY_MH.test(l) && !DESIG_RE.test(l) && !isOwn(l); };
  for (let i = 0; i < lines.length && !out.contact; i++) {
    if (used.has(i)) continue;
    const l = lines[i], m = l.match(/^(.+?)\s*[(\-–,|]\s*(proprietor|prop\.|director|founder|partner|owner|manager|ceo|md)\b/i);
    if (m && nameish(m[1].trim())) { out.contact = m[1].trim(); used.add(i); }
    else if (nameish(l) && (/^(mr|mrs|ms|miss|dr|shri|smt|er|ca|adv)\.?\s/i.test(l) || DESIG_RE.test(lines[i + 1] || "") || (i > 0 && DESIG_RE.test(lines[i - 1]) && !BIZ_RE.test(lines[i - 1])))) { out.contact = l; used.add(i); }
  }
  out.contact = titleCase(out.contact.replace(/\s+/g, " "));
  // Business name: the strongest line near the top
  const billHead = /^(tax\s*invoice|invoice|bill(\s*of\s*supply)?|cash\s*memo|estimate|quotation|receipt|original|duplicate|triplicate|delivery\s*challan|for\s*recipient|gstin|state|date|no\.?)\b/i;
  let best = null;
  lines.slice(0, 14).forEach((l, i) => {
    if (used.has(i) || billHead.test(l) || DESIG_RE.test(l) && !BIZ_RE.test(l)) return;
    const letters = l.replace(/[^A-Za-z]/g, ""); if (letters.length < 3) return;
    let sc = 0;
    if (BIZ_RE.test(l)) sc += 6;
    if (letters === letters.toUpperCase()) sc += 2;
    sc += Math.max(0, 3 - i);
    if (l.length > 50) sc -= 4;
    if (/\d/.test(l)) sc -= 2;
    if (l.split(/\s+/).length > 7) sc -= 3;
    if (/[:]/.test(l)) sc -= 3;
    if (nameish(l) && !BIZ_RE.test(l)) sc -= 1;
    if (!best || sc > best.sc) best = {l, sc, i};
  });
  if (best && best.sc >= 1) out.name = best.l.replace(/^(m\/s\.?|messrs\.?)\s*/i, "").replace(/[\s,.;:\-]+$/, "").trim();
  if (!out.name && out.contact) out.name = out.contact;
  if (out.name && out.name === out.name.toUpperCase() && out.name.length > 3) out.name = out.name.replace(/\s+/g, " ");
  // State: from the GSTIN, else a state or Maharashtra city in the address, else the PIN code
  const pin = (out.address.match(/\b([1-9]\d{2})\s?(\d{3})\b/) || []).slice(1).join("");
  const blob = lines.join(" ");
  out.pos = out.gstin ? stateName(out.gstin.slice(0, 2))
    : (Object.values(STATES).find(n => new RegExp("\\b" + n + "\\b", "i").test(blob)) || (CITY_MH.test(blob) || /^4[0-4]/.test(pin) ? "Maharashtra" : ""));
  const notes = [];
  if (mobs.length > 2) notes.push("Other mobiles: " + mobs.slice(2).join(", "));
  if (ph.land.length) notes.push("Landline: " + ph.land.map(x => x.slice(0, 4) + " " + x.slice(4)).join(", "));
  if (emails.length > 1) notes.push("Other email: " + emails.slice(1).join(", "));
  if (webs.length) notes.push("Web: " + webs.join(", "));
  out.notes = notes.join(" · ");

}
function ownDetails() {
  const c = set().company;
  return {name: c.name, gstin: c.gstin, pan: c.pan, email: c.email, phones: findPhones([c.phone || ""]).mob};
}
/* Google Drive OCR: upload as a Google Doc (Drive reads the text), export as text, delete it */
async function driveOCR(blob, mime) {
  const call = async (url, opts = {}) => {
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 120 * 1000);
    let r;
    try { r = await fetch(url, {...opts, signal: ac.signal, headers: {Authorization: "Bearer " + AUTH.token, ...(opts.headers || {})}}); }
    catch { throw new Error("couldn't reach Google — check the internet connection"); }
    finally { clearTimeout(tm); }
    if (r.status === 401) { AUTH.token = ""; throw Object.assign(new Error("Google sign-in has expired — press Scan again"), {code: "auth"}); }
    if (!r.ok) { let m = "Google returned " + r.status; try { m = (await r.json()).error.message; } catch {} throw new Error(m); }
    return r;
  };
  const bnd = "vdo" + newId();
  const meta = {name: "VD Desk scan (temporary) " + newId(), mimeType: "application/vnd.google-apps.document"};
  const body = new Blob([`--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bnd}\r\nContent-Type: ${mime}\r\n\r\n`, blob, `\r\n--${bnd}--`]);
  const made = await (await call("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&ocrLanguage=en&fields=id", {method: "POST", headers: {"Content-Type": `multipart/related; boundary=${bnd}`}, body})).json();
  try { return (await (await call(`${DRIVE}/${encodeURIComponent(made.id)}/export?mimeType=text/plain`)).text()).replace(/^﻿/, ""); }
  finally { call(`${DRIVE}/${encodeURIComponent(made.id)}`, {method: "DELETE"}).catch(() => {}); }
}
function scanChooser() {

      <p style="margin:0">Take a photo of a visiting card, or pick a supplier's bill (photo or PDF). The app reads the name, mobile, email, GSTIN, PAN and address and fills in the client form for you to check.</p>

      <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-cam>📷 Take photo</button><label class="btn" for="sc-file" style="cursor:pointer">🖼 Choose photo or PDF</label></div>

  });
}
function scanPreview(scan) {
