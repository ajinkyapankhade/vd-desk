async function scanClient() {
  if (!navigator.onLine) return toast("Reading a card needs internet. Add the client by hand, or try again when online.", true);
  if (!L.email || !clientId()) return toast("Sign in with Google first (Google & backup) — Google does the reading.", true);
  if (!tokenOk()) {
    try { await getToken(); rememberToken(); }
    catch (e) { return toast(e.message || "Google sign-in didn't finish.", true); }
  }
  const pick = await scanChooser(); if (!pick) return;
  const {file, role} = pick;
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
  if (!isPdf && file.type && !/^image\//.test(file.type)) return toast("Pick a photo or a PDF.", true);
  if (file.size > 20e6) return toast("That file is over 20 MB — take a photo instead.", true);
  toast(`Reading the ${isPdf ? "PDF" : "photo"}… (a few seconds)`, false, 60000);
  try {
    let img = "", blob = file, mime = isPdf ? "application/pdf" : "image/jpeg";
    if (!isPdf) { img = await shrinkImage(file, 2200); blob = await (await fetch(img)).blob(); }
    const text = await driveOCR(blob, mime);
    const c = parseCard(text, ownDetails());
    $$(".toast").forEach(t => t.remove());
    if (!c.name && !c.phone && !c.gstin && !c.email) toast("Couldn't find much on it — is the photo sharp and well lit? You can still fill the form by hand.", true, 7000);
    c.role = role; c.type = (set().lists.verticals || ["Printing"])[0];
    await scanResult(c, {img, text, pdf: isPdf ? file.name : ""});
  } catch (e) {
    $$(".toast").forEach(t => t.remove());
    toast("Couldn't read it: " + (e && e.message || "unknown error"), true, 8000);
  }
}
async function scanResult(c, scan) {
  const phones = mobiles(c.phone) || [];
  let dup = null, why = "";
  if (c.gstin) { dup = S.clients.find(x => x.gstin === c.gstin); why = "same GSTIN"; }
  if (!dup && phones.length) { dup = S.clients.find(x => (mobiles(x.phone) || []).some(p => phones.includes(p))); why = "same mobile number"; }
  if (!dup && c.name) { dup = S.clients.find(x => key(x.name) === key(c.name)); why = "same name"; }
  if (dup) {
    const r = await modal({title: "Already in Clients?", body: `<p style="margin:0"><b>${esc(dup.name)}</b> is already in Clients (${why}). Fill in what's missing on that client, or add a new one?</p>`,
      actions: [{label: "Cancel", value: false, cls: "ghost"}, {label: "Add as new client", value: "new"}, {label: `Update ${dup.name}`, value: "upd", cls: "primary"}]});
    if (!r?.value) return;
    if (r.value === "upd") {
      const m = {...dup};
      for (const k of ["address", "gstin", "pan", "pos", "contact", "phone", "email"]) if (!String(m[k] || "").trim() && c[k]) m[k] = c[k];
      if (c.phone && m.phone && !(mobiles(m.phone) || []).some(p => phones.includes(p))) m.phone = [...new Set([...(mobiles(m.phone) || []), ...phones])].slice(0, 3).join(", ");
      if (c.notes && !String(m.notes || "").includes(c.notes)) m.notes = [m.notes, c.notes].filter(Boolean).join(" · ");
      const cur = m.role || "Customer"; m.role = cur === c.role ? cur : "Both";
      return editClient(m, scan);
    }
    if (key(dup.name) === key(c.name)) c.name = c.name + (c.address ? " - " + c.address.split(",").slice(-2, -1).join("").trim() : " (2)");
  }
  return editClient(c, scan);
}

<script>
"use strict";
/* =====================================================================
   GST FILING (v13) — everything the CA needs to file GSTR-1 and GSTR-3B
   for one month, built from the saved Tax Invoices and Expenses.
   - gstMonth(ym)      → all the numbers + problems for "YYYY-MM"
   - VIEWS.gst / AFTER.gst → the screen
   - gstWorkbook(ym)   → Excel (GST offline-tool columns + register + 3B)
   - gstPdfHTML(ym)    → A4 summary pages (PDF / WhatsApp to the CA)
   Filed status lives in Settings → defaults.gstFiled[ym] = {r1: {on, arn}, r3b: {on, arn}}
   and the CA's WhatsApp number in defaults.caPhone (both sync with the Sheet).
   ===================================================================== */
const B2CL_LIMIT = 100000;   // inter-state B2C invoices above ₹1 lakh are reported one by one (from Aug 2024)
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ymOf = iso => String(iso || "").slice(0, 7);
const ymAdd = (ym, n) => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m - 1 + n, 1)).toISOString().slice(0, 7); };
const ymLabel = ym => { const [y, m] = String(ym).split("-").map(Number); return m ? `${MONTHS_FULL[m - 1]} ${y}` : ""; };
const gstDue = ym => ({r1: ymAdd(ym, 1) + "-11", r3b: ymAdd(ym, 1) + "-20"});   // monthly filer
const gstFiled = ym => ((set().defaults.gstFiled || {})[ym]) || {};
const posLabel = c => c ? `${c}-${stateName(c)}` : "";
const UQC = {PCS: "PCS-PIECES", PC: "PCS-PIECES", PIECE: "PCS-PIECES", PIECES: "PCS-PIECES", NOS: "NOS-NUMBERS", NO: "NOS-NUMBERS", SET: "SET-SETS", SETS: "SET-SETS",
  SQFT: "SQF-SQUARE FEET", SQF: "SQF-SQUARE FEET", SQM: "SQM-SQUARE METERS", SQMTR: "SQM-SQUARE METERS", MTR: "MTR-METERS", M: "MTR-METERS", METER: "MTR-METERS",
  KG: "KGS-KILOGRAMS", KGS: "KGS-KILOGRAMS", GM: "GMS-GRAMMES", GMS: "GMS-GRAMMES", BOX: "BOX-BOX", PKT: "PAC-PACKS", PACK: "PAC-PACKS", PAC: "PAC-PACKS",
  ROLL: "ROL-ROLLS", ROL: "ROL-ROLLS", DOZ: "DOZ-DOZENS", BDL: "BDL-BUNDLES", UNIT: "UNT-UNITS", UNT: "UNT-UNITS", LTR: "LTR-LITRES", BTL: "BTL-BOTTLES", PRS: "PRS-PAIRS", PAIR: "PRS-PAIRS"};
const uqcOf = u => UQC[String(u || "").toUpperCase().replace(/[^A-Z]/g, "")] || "OTH-OTHERS";
const r2 = v => rnd(v, 2);

function gstMonth(ym) {
  const co = set().company, home = ownStateCode(), own = String(co.gstin || "").toUpperCase();
  const byNo = (a, b) => (a.date + a.no).localeCompare(b.date + b.no, undefined, {numeric: true});
  const inMonth = appDocs().filter(d => d.kind === "invoice" && ymOf(d.date) === ym);
  const inv = inMonth.filter(d => d.type === "INVOICE").sort(byNo);
  const bills = inMonth.filter(d => d.type === "BILL").sort(byNo);
  const errs = [], warns = [];
  const E = (d, m) => errs.push({id: d ? d.id : "", no: d ? d.no : "", m});
  const W = (d, m) => warns.push({id: d ? d.id : "", no: d ? d.no : "", m});
  const b2b = [], b2cl = [], reg = [];
  const b2cs = new Map(), unregInter = new Map(), hsn = {b2b: new Map(), b2c: new Map()};
  const nil = {interReg: 0, intraReg: 0, interUnreg: 0, intraUnreg: 0};
  const out = {taxable: 0, igst: 0, cgst: 0, sgst: 0, nil: 0, value: 0};
  if (!own) E(null, "Your own GSTIN is blank on Settings — it's needed on every return.");

  for (const d of inv) {
    const g = String(d.gstin || "").trim().toUpperCase(), regd = !!g;
    const gBad = regd ? gstinProblem(g) : "";
    if (gBad) E(d, `Client GSTIN ${g}: ${gBad}`);
    else if (regd && g === own) E(d, "The client GSTIN is your own GSTIN.");
    let pc = stateCode(d.pos);
    if (!pc) { pc = regd && !gBad ? g.slice(0, 2) : home; W(d, `No place of supply on the invoice — counted as ${stateName(pc)}.`); }
    const inter = pc !== home, chargedInter = d.supply === INTER;
    if (inter !== chargedInter) E(d, `Place of supply is ${stateName(pc)}, so the tax should be ${inter ? "IGST" : "CGST + SGST"} — this invoice charged ${chargedInter ? "IGST" : "CGST + SGST"}.`);
    if (regd && !gBad && g.slice(0, 2) !== pc) W(d, `Client's GSTIN is from ${stateName(g.slice(0, 2))} but the place of supply is ${stateName(pc)} — right only if the goods were delivered there.`);
    const sec = regd ? "B2B" : inter && num(d.total) > B2CL_LIMIT ? "B2CL" : "B2CS";
    const rates = new Map();
    (d.lines || []).forEach((l, i) => {
      const amt = num(l.amount), rate = r2(num(l.gst) * 100);
      const h = String(l.hsn || "").replace(/\s/g, "");
      if (!h) E(d, `Line ${i + 1} (${l.desc}) has no HSN/SAC code — the HSN table needs one for every line.`);
      else if (!/^\d{4}(\d{2}){0,2}$/.test(h)) E(d, `Line ${i + 1}: HSN/SAC “${h}” should be 4, 6 or 8 digits.`);
      const rg = rates.get(rate) || {rate, taxable: 0}; rg.taxable += amt; rates.set(rate, rg);
      const svc = h.startsWith("99"), uqc = svc ? "NA" : uqcOf(l.unit), M = regd ? hsn.b2b : hsn.b2c, k = `${h}|${uqc}|${rate}`;
      const x = M.get(k) || {hsn: h, desc: l.desc, uqc, qty: 0, rate, taxable: 0, igst: 0, cgst: 0, sgst: 0};
      const tax = amt * rate / 100;
      x.qty += svc ? 0 : num(l.qty); x.taxable += amt;
      if (inter) x.igst += tax; else { x.cgst += tax / 2; x.sgst += tax / 2; }
      M.set(k, x);
    });
    let ti = 0, tc = 0, ts = 0, tx = 0;
    for (const rg of [...rates.values()].sort((a, b) => a.rate - b.rate)) {
      rg.taxable = r2(rg.taxable);
      const tax = r2(rg.taxable * rg.rate / 100), igst = inter ? tax : 0, cgst = inter ? 0 : r2(tax / 2), sgst = cgst;
      ti += igst; tc += cgst; ts += sgst; tx += rg.taxable;
      if (!rg.rate) { nil[(inter ? "inter" : "intra") + (regd ? "Reg" : "Unreg")] += rg.taxable; out.nil += rg.taxable; continue; }
      out.taxable += rg.taxable; out.igst += igst; out.cgst += cgst; out.sgst += sgst;
      if (sec === "B2B") b2b.push({id: d.id, gstin: g, name: d.client, no: d.no, date: d.date, value: num(d.total), pos: pc, rate: rg.rate, taxable: rg.taxable, igst, cgst, sgst});
      else if (sec === "B2CL") b2cl.push({id: d.id, no: d.no, date: d.date, name: d.client, value: num(d.total), pos: pc, rate: rg.rate, taxable: rg.taxable, igst});
      else { const k = pc + "|" + rg.rate, y = b2cs.get(k) || {pos: pc, rate: rg.rate, taxable: 0, igst: 0, cgst: 0, sgst: 0, n: new Set()}; y.taxable += rg.taxable; y.igst += igst; y.cgst += cgst; y.sgst += sgst; y.n.add(d.no); b2cs.set(k, y); }
      if (!regd && inter) { const u = unregInter.get(pc) || {pos: pc, taxable: 0, igst: 0}; u.taxable += rg.taxable; u.igst += igst; unregInter.set(pc, u); }
    }
    if (Math.abs(ti + tc + ts - num(d.gstAmt)) >= 1) W(d, `GST on the invoice (₹${money(d.gstAmt)}) differs from rate × taxable value (₹${money(ti + tc + ts)}) by ₹1 or more — open it and Save again.`);
    out.value += num(d.total);
    reg.push({id: d.id, no: d.no, date: d.date, client: d.client, gstin: g, pos: pc, sec, taxable: r2(tx), igst: r2(ti), cgst: r2(tc), sgst: r2(ts), total: num(d.total)});
  }
  for (const M of [hsn.b2b, hsn.b2c]) for (const x of M.values()) { x.taxable = r2(x.taxable); x.qty = rnd(x.qty, 3); x.igst = r2(x.igst); x.cgst = r2(x.cgst); x.sgst = r2(x.sgst); x.value = r2(x.taxable + x.igst + x.cgst + x.sgst); }
  for (const y of b2cs.values()) { y.taxable = r2(y.taxable); y.igst = r2(y.igst); y.cgst = r2(y.cgst); y.sgst = r2(y.sgst); y.count = y.n.size; }
  for (const k of Object.keys(out)) out[k] = r2(out[k]);
  for (const k of Object.keys(nil)) nil[k] = r2(nil[k]);

  /* Table 13 — invoice number ranges, gaps counted as cancelled */
  const docs = [], groups = new Map();
  for (const d of inv) {
    const m = /^(.*?)(\d+)$/.exec(String(d.no || "").trim());
    if (!m) { docs.push({from: d.no, to: d.no, total: 1, cancelled: 0}); continue; }
    const gk = m[1].toUpperCase(), gr = groups.get(gk) || {prefix: m[1], items: []};
    gr.items.push({n: Number(m[2]), no: d.no, w: m[2].length}); groups.set(gk, gr);
  }
  const cancelled = [], elsewhere = [];
  for (const gr of groups.values()) {
    gr.items.sort((a, b) => a.n - b.n);
    const lo = gr.items[0], hi = gr.items[gr.items.length - 1], have = new Set(gr.items.map(x => x.n));
    let c = 0;
    for (let n = lo.n + 1; n < hi.n && n - lo.n < 5000; n++) {
      if (have.has(n)) continue;
      const no = gr.prefix + String(n).padStart(lo.w, "0"), other = usedNo(no);
      if (other) elsewhere.push(`${no} (${fmtDate(other.date)})`); else { cancelled.push(no); c++; }
    }
    docs.push({from: lo.no, to: hi.no, total: hi.n - lo.n + 1, cancelled: c});
  }
  if (cancelled.length) W(null, `Missing invoice number${cancelled.length > 1 ? "s" : ""} ${cancelled.slice(0, 8).join(", ")}${cancelled.length > 8 ? ` +${cancelled.length - 8} more` : ""} — counted as cancelled in the document summary (Table 13). Right if they were deleted or never issued.`);
  if (elsewhere.length) W(null, `${elsewhere.join(", ")} sit${elsewhere.length > 1 ? "" : "s"} inside this month's number range but ${elsewhere.length > 1 ? "are" : "is"} dated in another month — tell your CA so the Table 13 range can be split.`);

  /* Input tax credit: from GSTR-2B when its file is loaded for this month (v14), else estimated from Expenses */
  const itc = S.expenses.filter(x => ymOf(x.billDate || x.date) === ym && num(x.gstAmt) > 0).sort((a, b) => (a.billDate || a.date || "").localeCompare(b.billDate || b.date || "")).map(x => {
    const sp = expSplit(x);
    return {id: x.id, date: x.billDate || x.date, vendor: x.vendor, desc: x.desc, billNo: x.billNo, gstin: sp.gstin, basic: num(x.basic), rate: r2(num(x.gst) * 100), gst: num(x.gstAmt),
            igst: sp.igst, cgst: sp.cgst, sgst: sp.sgst, amount: num(x.amount)};
  });
  const withG = itc.filter(x => x.gstin), noG = itc.filter(x => !x.gstin);
  const g2b = g2bRecon(ym);
  const credit = g2b ? {...g2b.claim} : {igst: r2(withG.reduce((s, x) => s + x.igst, 0)), cgst: r2(withG.reduce((s, x) => s + x.cgst, 0)), sgst: r2(withG.reduce((s, x) => s + x.sgst, 0))};
  if (noG.length) W(null, `${noG.length} expense${noG.length > 1 ? "s" : ""} with ₹${money(noG.reduce((s, x) => s + x.gst, 0))} GST ${noG.length > 1 ? "have" : "has"} no supplier GSTIN, so no input credit is counted for ${noG.length > 1 ? "them" : "it"}. Add the GSTIN on the expense (Edit) if the bill shows one.`);
  if (!g2b && withG.length) W(null, "Input credit below is an estimate from your expenses. Load this month's GSTR-2B file (Compare with GSTR-2B) to check it bill by bill.");
  if (g2b) {
    const T = a => money(a.reduce((s, r) => s + r.tax, 0));
    if (g2b.only2b.length) W(null, `${g2b.only2b.length} bill${g2b.only2b.length > 1 ? "s" : ""} in GSTR-2B (GST ₹${T(g2b.only2b)}) ${g2b.only2b.length > 1 ? "aren't" : "isn't"} in your expenses — add ${g2b.only2b.length > 1 ? "them" : "it"} to claim the credit, or mark Not mine and reject in IMS.`);
    if (g2b.probable.length) W(null, `${g2b.probable.length} bill${g2b.probable.length > 1 ? "s look" : " looks"} like ${g2b.probable.length > 1 ? "ones" : "one"} in GSTR-2B but the bill no. or GSTIN differs — confirm with “Same bill” to count the credit.`);
    if (g2b.missing.length) W(null, `${g2b.missing.length} of your bills (GST ₹${money(g2b.missing.reduce((s, x) => s + num(x.gstAmt), 0))}) ${g2b.missing.length > 1 ? "aren't" : "isn't"} in GSTR-2B yet — remind the supplier to file their GSTR-1. The credit waits until it shows.`);
    if (g2b.blocked.length) W(null, `${g2b.blocked.length} GSTR-2B bill${g2b.blocked.length > 1 ? "s are" : " is"} marked “ITC not available” or reverse charge — not counted; your CA decides.`);
    if (g2b.cdn) W(null, `GSTR-2B also has ${g2b.cdn} credit/debit note${g2b.cdn > 1 ? "s" : ""} from suppliers — not matched here; your CA adjusts the credit for ${g2b.cdn > 1 ? "them" : "it"}.`);
  }
  if (bills.length) W(null, `${bills.length} non-GST Bill${bills.length > 1 ? "s" : ""} worth ₹${money(bills.reduce((s, b) => s + num(b.total), 0))} ${bills.length > 1 ? "are" : "is"} dated this month. They're not in these GST tables — ask your CA how they should be shown.`);
  if (!inv.length) W(null, `No tax invoices dated in ${ymLabel(ym)}. A nil GSTR-1 and GSTR-3B still has to be filed.`);

  /* GSTR-3B set-off (IGST credit first, then CGST/SGST; CGST and SGST never cross) */
  const liab = {igst: out.igst, cgst: out.cgst, sgst: out.sgst}, left = {...credit}, cash = {...liab};
  const take = (f, t) => { const u = Math.min(left[f], cash[t]); left[f] = r2(left[f] - u); cash[t] = r2(cash[t] - u); };
  take("igst", "igst"); take("igst", "cgst"); take("igst", "sgst"); take("cgst", "cgst"); take("cgst", "igst"); take("sgst", "sgst"); take("sgst", "igst");

  return {ym, inv, bills, errs, warns, b2b, b2cl, b2cs: [...b2cs.values()].sort((a, b) => a.pos.localeCompare(b.pos) || a.rate - b.rate),
    hsnB2B: [...hsn.b2b.values()].sort((a, b) => a.hsn.localeCompare(b.hsn) || a.rate - b.rate), hsnB2C: [...hsn.b2c.values()].sort((a, b) => a.hsn.localeCompare(b.hsn) || a.rate - b.rate),
    nil, docs, reg, out, itc, credit, g2b, cash, carry: left, unregInter: [...unregInter.values()].map(u => ({...u, taxable: r2(u.taxable), igst: r2(u.igst)})).sort((a, b) => a.pos.localeCompare(b.pos))};
}

/* Months to offer: from the first saved invoice/expense (or FY start) up to this month */
function gstMonths() {
  let first = ymOf(set().defaults.fyStart) || ymOf(todayISO());
  for (const d of appDocs()) if (d.kind === "invoice" && d.date && ymOf(d.date) < first) first = ymOf(d.date);
  for (const x of S.expenses) if (x.date && ymOf(x.date) < first) first = ymOf(x.date);
  const out = [], cur = ymOf(todayISO());
  for (let ym = cur; ym >= first && out.length < 60; ym = ymAdd(ym, -1)) out.push(ym);
  return out;
}
const sumBy = (a, k) => r2(a.reduce((s, x) => s + num(x[k]), 0));
function dueText(on, filed) {
  if (filed) return `Filed ${fmtDate(filed.on)}${filed.arn ? ` · ARN ${filed.arn}` : ""}`;
  const n = daysBetween(todayISO(), on);
  return n > 0 ? `due ${fmtDate(on)} · ${n} day${n > 1 ? "s" : ""} left` : n === 0 ? `due today (${fmtDate(on)})` : `was due ${fmtDate(on)} · ${-n} day${n < -1 ? "s" : ""} late`;
}
/* Shown on Home: the return that needs doing next */
function gstHomeTodo() {
  const ym = ymAdd(ymOf(todayISO()), -1), f = gstFiled(ym), d = gstDue(ym);
  const done = !!(f.r1 && f.r3b);
  const left = [!f.r1 ? `GSTR-1 ${dueText(d.r1)}` : "", !f.r3b ? `GSTR-3B ${dueText(d.r3b)}` : ""].filter(Boolean).join(", ");
  return [done, done ? `GST for ${ymLabel(ym)} is filed. <a href="#" data-go="gst">GST filing</a>` : `GST for ${ymLabel(ym)}: ${esc(left)}. <a href="#" data-go="gst">Prepare it on GST filing</a> and send it to your CA.`];
}

async function gstMarkFiled(ym, k) {
  const label = k === "r1" ? "GSTR-1" : "GSTR-3B";
  const r = await modal({title: `${label} for ${ymLabel(ym)} filed`,
    body: `<div class="grid g2"><label class="f" for="gf-on">Filed on<input class="inp fill" type="date" id="gf-on" data-req="1" value="${todayISO()}"></label>
      <label class="f" for="gf-arn">ARN (optional)<input class="inp fill mono" id="gf-arn" maxlength="20" placeholder="From the CA or the portal" autocomplete="off"></label></div>
      <p class="muted" style="margin:10px 0 0;font-size:13px">${k === "r1" ? `After this, changing or deleting a tax invoice dated in ${esc(ymLabel(ym))} asks first.` : "Mark it once the tax is paid and the return is filed."}</p>`,
    actions: [{label: "Cancel", value: false, cls: "ghost"}, {label: "Mark filed", value: true, cls: "primary", collect: s => {
      const errs = vCheck(s); if (errs.length) return vFail(errs, s);
      const on = $("#gf-on", s).value;
      if (on > todayISO()) { toast("The filing date can't be in the future.", true); return false; }
      return {on, arn: $("#gf-arn", s).value.trim().toUpperCase().replace(/\s/g, "")};
    }}]});
  if (!r?.value) return;
  write(db => db.doc("config/settings").update({defaults: {gstFiled: {[ym]: {[k]: r.data}}}}), `${label} for ${ymLabel(ym)} marked filed.`);
}

/* Before changing/deleting a tax invoice in a month whose GSTR-1 is filed */
async function gstFiledGuard(doc, action) {
  if (!doc || doc.type !== "INVOICE" || doc.source !== "app") return true;
  const ym = ymOf(doc.date), f = gstFiled(ym).r1;
  if (!f) return true;
  return confirmBox(`GSTR-1 for ${ymLabel(ym)} is already filed`,
    `<span class="mono">${esc(doc.no)}</span> is dated ${esc(fmtDate(doc.date))}, and GSTR-1 for ${esc(ymLabel(ym))} was filed on ${esc(fmtDate(f.on))}. ${action === "delete" ? "Deleting" : "Changing"} it here won't change the filed return — tell your CA so they can amend it or issue a credit note.`,
    action === "delete" ? "Delete anyway" : "Save anyway", action === "delete");
}

async function gstDownloadExcel(ym) {

/* ---------- GSTR-2B (v14): the purchase bills your suppliers reported with your GSTIN ----------
   The 2B file (Excel, JSON, or the zip the portal gives) is read on this device and kept in
   IndexedDB as g2b:<email>:<YYYY-MM> = {ym, file, loadedAt, rows, cdn, marks}. It is matched with
   Expenses (supplier GSTIN + bill no.) — fixes made from here (add bill, same bill) are normal
   expense edits and sync like any other. */
S.g2b = {};
const g2bKey = ym => `g2b:${L.email}:${ym}`;
async function g2bLoad(ym) {
  if (S.g2b[ym] !== undefined) return S.g2b[ym];
  let d = null; try { d = (await kv.get(g2bKey(ym))) || null; } catch {}
  S.g2b[ym] = d; return d;
}
async function g2bSave(ym, d) { S.g2b[ym] = d; if (d) await kv.set(g2bKey(ym), d); else await kv.del(g2bKey(ym)); }
const normInv = v => String(v || "").toUpperCase().replace(/\d+/g, d => String(Number(d))).replace(/[^A-Z0-9]/g, "");
const nameKey = v => String(v || "").toUpperCase().replace(/\b(M\/S|MS|THE|SHRI|SHREE|SRI)\b/g, "").replace(/[^A-Z0-9]/g, "");
const nameLike = (a, b) => { const x = nameKey(a), y = nameKey(b); return !!x && !!y && (x.slice(0, 6) === y.slice(0, 6) || x.includes(y) || y.includes(x)); };
function g2bDate(v) {
  if (v == null || v === "") return "";
  if (typeof v === "number" && window.XLSX) { const d = window.XLSX.SSF.parse_date_code(v); if (d) return `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}`; }
  const s = String(v).trim();
  let m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(s); if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  m = /^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]+(\d{4})$/.exec(s);
  if (m) { const k = MON.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); if (k >= 0) return `${m[3]}-${String(k + 1).padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (m) return m[0];
  return "";
}
function g2bAdd(map, r) {
  const k = r.gstin + "|" + normInv(r.inum);
  const x = map.get(k) || {key: k, gstin: r.gstin, name: String(r.name || "").trim(), inum: String(r.inum).trim(), date: r.date, val: 0, txval: 0, igst: 0, cgst: 0, sgst: 0, itc: "Y", rc: false, rates: [], period: String(r.period || "")};
  x.val = Math.max(x.val, num(r.val)); x.txval += num(r.txval); x.igst += num(r.igst); x.cgst += num(r.cgst); x.sgst += num(r.sgst);
  if (r.rate !== "" && r.rate != null && !x.rates.includes(num(r.rate))) x.rates.push(num(r.rate));
  if (r.itc === "N") x.itc = "N";
  if (r.rc) x.rc = true;
  map.set(k, x);
}
function g2bDone(map) {
  return [...map.values()].map(x => { for (const k of ["txval", "igst", "cgst", "sgst"]) x[k] = r2(x[k]); x.tax = r2(x.igst + x.cgst + x.sgst); if (!x.val) x.val = r2(x.txval + x.tax); return x; })
    .sort((a, b) => (a.date + a.name).localeCompare(b.date + b.name));
}
function g2bFromJSON(o) {
  const root = o && o.data && o.data.data ? o.data.data : o && o.data && (o.data.docdata || o.data.rtnprd) ? o.data : o;
  const dd = (root && (root.docdata || root.docData)) || {};
  if (!dd.b2b && !dd.cdnr && !root.rtnprd) throw new Error("This JSON doesn't look like a GSTR-2B file.");
  const map = new Map();
  for (const s of dd.b2b || []) for (const inv of s.inv || []) {
    const items = inv.items || inv.itms || [];
    const base = {gstin: String(s.ctin || "").toUpperCase(), name: s.trdnm || "", inum: inv.inum, date: g2bDate(inv.dt || inv.idt), val: inv.val,
      itc: String(inv.itcavl || "Y").toUpperCase().startsWith("N") ? "N" : "Y", rc: String(inv.rev || inv.rchrg || "N").toUpperCase() === "Y", period: s.supprd || ""};
    if (!items.length) g2bAdd(map, {...base, txval: inv.txval, igst: inv.igst, cgst: inv.cgst, sgst: inv.sgst, rate: ""});
    for (const it of items) { const d = it.itm_det || it; g2bAdd(map, {...base, txval: d.txval, igst: d.igst ?? d.iamt, cgst: d.cgst ?? d.camt, sgst: d.sgst ?? d.samt, rate: d.rt ?? ""}); }
  }
  const cdn = (dd.cdnr || []).reduce((s, x) => s + (x.nt || []).length, 0);
  const rp = String(root.rtnprd || "");
  return {rows: g2bDone(map), cdn, ym: /^\d{6}$/.test(rp) ? `${rp.slice(2)}-${rp.slice(0, 2)}` : "", gstin: String(root.gstin || "").toUpperCase()};
}
function g2bFromSheets(X, wb) {
  const nm = n => String(n).toUpperCase().replace(/[^A-Z0-9]/g, "");
  const isG = v => /^\d{2}[A-Z]{5}\d{4}[A-Z][0-9A-Z]{3}$/.test(String(v || "").trim().toUpperCase());
  const grid = name => X.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: ""});
  const parse = name => {
    const A = grid(name);
    const hi = A.findIndex(r => r.some(c => /gstin\s*of\s*(the\s*)?supplier/i.test(String(c))));
    if (hi < 0) return null;
    const top = [...A[hi]], sub = A[hi + 1] || [];
    const twoRow = !sub.some(isG);
    if (twoRow) for (let j = 1; j < Math.max(top.length, sub.length); j++) if (String(top[j] ?? "") === "" && String(sub[j] ?? "") !== "") top[j] = top[j - 1];
    const H = Array.from({length: Math.max(top.length, sub.length)}, (_, j) => `${top[j] ?? ""} ${twoRow ? sub[j] ?? "" : ""}`.replace(/\s+/g, " ").trim().toLowerCase());
    const col = (re, not) => H.findIndex(h => re.test(h) && !(not && not.test(h)));
    const c = {gstin: col(/gstin/), name: col(/trade|legal/), inum: col(/invoice number|invoice no|note number|note no|document number/), date: col(/invoice date|note date|document date/),
      val: col(/invoice value|note value|document value/), txval: col(/taxable/), igst: col(/integrated/), cgst: col(/central/), sgst: col(/state\s*\/\s*ut|state tax|state\/ut/, /place/),
      itc: col(/itc avail/), rc: col(/reverse/), rate: col(/rate/, /applicable/), period: col(/period/)};
    const at = (r, k) => c[k] < 0 ? "" : r[c[k]];
    const rows = A.slice(hi + (twoRow ? 2 : 1)).filter(r => isG(at(r, "gstin")));
    return {c, rows, at};
  };
  const b2b = wb.SheetNames.find(n => nm(n) === "B2B");
  if (!b2b) throw new Error("No “B2B” sheet in this file — is it the GSTR-2B Excel from the GST portal?");
  const P = parse(b2b);
  if (!P) throw new Error("Couldn't find the “GSTIN of supplier” heading in the B2B sheet.");
  if (P.c.inum < 0 || P.c.txval < 0) throw new Error("The B2B sheet has no invoice number or taxable value column.");
  const map = new Map();
  for (const r of P.rows) g2bAdd(map, {gstin: String(P.at(r, "gstin")).trim().toUpperCase(), name: P.at(r, "name"), inum: P.at(r, "inum"), date: g2bDate(P.at(r, "date")), val: P.at(r, "val"),
    txval: P.at(r, "txval"), igst: P.at(r, "igst"), cgst: P.at(r, "cgst"), sgst: P.at(r, "sgst"), rate: P.at(r, "rate"),
    itc: /^\s*n/i.test(String(P.at(r, "itc"))) ? "N" : "Y", rc: /^\s*y/i.test(String(P.at(r, "rc"))), period: P.at(r, "period")});
  const cdnName = wb.SheetNames.find(n => nm(n) === "B2BCDNR" || nm(n) === "CDNR");
  const C = cdnName ? parse(cdnName) : null;
  let ym = "";
  for (const n of wb.SheetNames.slice(0, 3)) {
    const txt = grid(n).slice(0, 12).flat().map(String).join(" ");
    const m = new RegExp(`(?:tax period|return period)\\D{0,12}(${MONTHS_FULL.join("|")})`, "i").exec(txt);
    const fy = /(?:financial year)\D{0,12}(\d{4})\s*-\s*(\d{2,4})/i.exec(txt);
    if (m && fy) { const mi = MONTHS_FULL.findIndex(x => x.toLowerCase() === m[1].toLowerCase()) + 1; ym = `${mi >= 4 ? fy[1] : Number(fy[1]) + 1}-${String(mi).padStart(2, "0")}`; break; }
  }
  return {rows: g2bDone(map), cdn: C ? C.rows.length : 0, ym, gstin: ""};
}
async function g2bReadFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const isZip = buf[0] === 0x50 && buf[1] === 0x4b;
  const text = b => new TextDecoder().decode(b);
  if (!isZip && (buf[0] === 0x7b || /\.json$/i.test(file.name))) return g2bFromJSON(JSON.parse(text(buf)));
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const X = window.XLSX;
  if (isZip) {
    const z = X.CFB.read(buf, {type: "array"});
    if (!z.FullPaths.some(p => /\[Content_Types\]\.xml$/i.test(p))) {
      const i = z.FullPaths.findIndex(p => /\.json$/i.test(p)), j = z.FullPaths.findIndex(p => /\.xlsx?$/i.test(p));
      if (i >= 0) return g2bFromJSON(JSON.parse(text(new Uint8Array(z.FileIndex[i].content))));
      if (j >= 0) return g2bFromSheets(X, X.read(new Uint8Array(z.FileIndex[j].content), {type: "array"}));
      throw new Error("This zip has no GSTR-2B JSON or Excel file inside.");
    }
  }
  return g2bFromSheets(X, X.read(buf, {type: "array"}));
}
async function g2bImport(ym, file) {
  toast("Reading the GSTR-2B file…");
  let d;
  try { d = await g2bReadFile(file); } catch (e) { return toast("Couldn't read that file: " + (e && e.message || e), true, 9000); }
  if (!d.rows.length && !d.cdn) return toast("No supplier bills found in that file (B2B section is empty).", true, 7000);
  const own = String(set().company.gstin || "").toUpperCase();
  if (d.gstin && own && d.gstin !== own && !(await confirmBox("Different GSTIN", `This GSTR-2B belongs to GSTIN <b>${esc(d.gstin)}</b>, not yours (${esc(own)}). Load it anyway?`, "Load anyway", true))) return;
  if (d.ym && d.ym !== ym) {
    if (!(await confirmBox("Different month", `This file is GSTR-2B for <b>${esc(ymLabel(d.ym))}</b>, but the screen shows ${esc(ymLabel(ym))}. Load it for ${esc(ymLabel(d.ym))}?`, `Load for ${ymLabel(d.ym)}`))) return;
    ym = d.ym; S.gstYm = ym;
  }
  const old = await g2bLoad(ym);
  await g2bSave(ym, {ym, file: file.name, loadedAt: nowISO(), rows: d.rows, cdn: d.cdn, marks: (old && old.marks) || {}});
  render();
  toast(`GSTR-2B for ${ymLabel(ym)} loaded: ${d.rows.length} bill${d.rows.length === 1 ? "" : "s"} from ${new Set(d.rows.map(r => r.gstin)).size} supplier${d.rows.length === 1 ? "" : "s"}.`);
}

/* Match GSTR-2B with Expenses: 1) same supplier GSTIN + bill no.; 2) same supplier (or similar name) + same amount ±₹1 within 90 days */
function g2bRecon(ym) {
  const D = S.g2b[ym]; if (!D) return null;
  const exps = S.expenses.map(x => ({x, g: expGstin(x), k: normInv(x.billNo), d: x.billDate || x.date || ""}));
  const used = new Set(), rows = D.rows.map(r => ({...r, exp: null, probable: false}));
  for (const r of rows) {
    const k = normInv(r.inum), e = exps.find(e => !used.has(e.x.id) && e.g === r.gstin && e.k && e.k === k);
    if (e) { used.add(e.x.id); r.exp = e.x; }
  }
  for (const r of rows) if (!r.exp) {
    const e = exps.find(e => !used.has(e.x.id) && (e.g === r.gstin || (!e.g && nameLike(e.x.vendor, r.name))) && Math.abs(num(e.x.amount) - r.val) <= 1 && (!r.date || !e.d || Math.abs(daysBetween(e.d, r.date)) <= 90));
    if (e) { used.add(e.x.id); r.exp = e.x; r.probable = true; }
  }
  const out = {D, rows, matched: [], probable: [], only2b: [], blocked: [], notmine: [], missing: [], cdn: D.cdn || 0};
  for (const r of rows) {
    r.diff = r.exp ? r2(r.tax - num(r.exp.gstAmt)) : 0;
    if ((D.marks || {})[r.key] === "notmine") out.notmine.push(r);
    else if (r.itc === "N" || r.rc) out.blocked.push(r);
    else if (r.exp && !r.probable) out.matched.push(r);
    else if (r.exp) out.probable.push(r);
    else out.only2b.push(r);
  }
  out.missing = S.expenses.filter(x => !used.has(x.id) && num(x.gstAmt) > 0 && expGstin(x) && ymOf(x.billDate || x.date) === ym)
    .sort((a, b) => (a.billDate || a.date || "").localeCompare(b.billDate || b.date || ""));
  out.claim = {igst: sumBy(out.matched, "igst"), cgst: sumBy(out.matched, "cgst"), sgst: sumBy(out.matched, "sgst")};
  return out;
}

      tbl(["Supplier", "Bill no. · date", "2B GST ₹", "Your GST ₹", "Difference ₹"], R.matched.map(r => `<tr>${sup(r)}<td class="mono nw">${esc(r.inum)} · ${fmtDate(r.date)}</td>${n(r.tax)}${n(r.exp.gstAmt)}<td class="n ${Math.abs(r.diff) >= 1 ? "bad-t" : ""}">${Math.abs(r.diff) >= 1 ? money(r.diff) : "—"}</td></tr>`)))}
    ${R.blocked.length ? sec("Not counted — ITC not available / reverse charge", `${R.blocked.length} bill${R.blocked.length === 1 ? "" : "s"} · your CA decides`,

    ${R.notmine.length ? sec("Marked “Not mine”", "reject these in IMS on the GST portal before GSTR-3B is filed",
      tbl(["Supplier", "Bill no. · date", "GST ₹", ""], R.notmine.map(r => `<tr>${sup(r)}<td class="mono nw">${esc(r.inum)} · ${fmtDate(r.date)}</td>${n(r.tax)}<td><button class="btn sm ghost" data-g2b-undo="${esc(r.key)}">Undo</button></td></tr>`)), true) : ""}
  </div>`;
}

function g2bWire(ym) {
  const R = () => g2bRecon(ym), row = k => (R() || {rows: []}).rows.find(r => r.key === k);
  let fi = $("#g2b-file");
  if (!fi) { fi = document.createElement("input"); fi.type = "file"; fi.id = "g2b-file"; fi.accept = ".xlsx,.xls,.json,.zip,application/json,application/zip"; fi.hidden = true; document.body.appendChild(fi); }
  fi.onchange = () => { const f = fi.files[0]; fi.value = ""; if (f) g2bImport(S.gstYm, f); };
  $$("[data-g2b-load]").forEach(b => b.addEventListener("click", () => fi.click()));
  $$("[data-g2b-clear]").forEach(b => b.addEventListener("click", async () => {
    if (!(await confirmBox("Remove the GSTR-2B file?", `The ${esc(ymLabel(ym))} GSTR-2B data and your “Not mine” marks are removed from this device. Your expenses stay as they are.`, "Remove", true))) return;
    await g2bSave(ym, null); S.g2b[ym] = null; render();
  }));
  const mark = async (k, v) => { const D = S.g2b[ym]; D.marks = D.marks || {}; if (v) D.marks[k] = v; else delete D.marks[k]; await g2bSave(ym, D); render(); };
  $$("[data-g2b-notmine]").forEach(b => b.addEventListener("click", async () => {

  }));
  $$("[data-g2b-undo]").forEach(b => b.addEventListener("click", () => mark(b.dataset.g2bUndo, null)));
  $$("[data-g2b-same]").forEach(b => b.addEventListener("click", async () => {
    const r = row(b.dataset.g2bSame); if (!r || !r.exp) return;
    if (!(await confirmBox("Same bill?", `Your expense <b>${esc(r.exp.vendor || "")}</b> (${esc(r.exp.billNo || "no bill no.")}, ₹${money(r.exp.amount)}) gets the supplier GSTIN <span class="mono">${esc(r.gstin)}</span>, bill no. <span class="mono">${esc(r.inum)}</span>${r.date ? ` and bill date ${esc(fmtDate(r.date))}` : ""} from GSTR-2B.`, "Yes, same bill"))) return;
    write(db => db.doc("expenses/" + r.exp.id).update({gstin: r.gstin, billNo: r.inum, ...(r.date ? {billDate: r.date} : {})}), "Expense updated — matched with GSTR-2B.");
  }));
  $$("[data-g2b-add]").forEach(b => b.addEventListener("click", () => { const r = row(b.dataset.g2bAdd); if (r) g2bAddExpense(r); }));
  $$("[data-g2b-remind]").forEach(b => b.addEventListener("click", () => {
    const x = S.expenses.find(z => z.id === b.dataset.g2bRemind); if (!x) return;
    const g = expGstin(x), c = S.clients.find(z => String(z.gstin || "").toUpperCase() === g) || clientOf(x.vendor), co = set().company;
    waShare({title: `Remind ${x.vendor || "the supplier"}`, phone: waNo(c && c.phone), text: [
      `Namaste${c && c.contact ? " " + c.contact : ""},`, "",
      `This is ${co.name}${co.gstin ? ` (GSTIN ${co.gstin})` : ""}. Your bill ${x.billNo ? "no. " + x.billNo + " " : ""}dated ${fmtDate(x.billDate || x.date)} for ₹${money(x.amount)} (GST ₹${money(x.gstAmt)}) doesn't show in our GSTR-2B for ${ymLabel(ym)}.`, "",
      `Please include it in your GSTR-1 with our GSTIN ${co.gstin || ""} so we can take the input credit. If it's already filed, please check the GSTIN and bill no. used.`, "", "Thank you."].join("\n")});
  }));
}
async function g2bAddExpense(r) {
  const L2 = set().lists, cats = L2.categories || [], cl = S.clients.find(c => String(c.gstin || "").toUpperCase() === r.gstin);
  const vendor = cl ? cl.name : r.name || r.gstin, rate = r.rates.length === 1 ? r.rates[0] / 100 : r.txval ? rnd(r.tax / r.txval, 4) : 0;
  const nameTaken = !cl && S.clients.some(c => key(c.name) === key(vendor));
  const res = await modal({title: `Add bill ${r.inum} as an expense`,
    body: `<p style="margin:0 0 10px">${esc(vendor)} · <span class="mono">${esc(r.gstin)}</span> · ${esc(fmtDate(r.date))}<br>Value ₹${money(r.val)} = taxable ₹${money(r.txval)} + GST ₹${money(r.tax)}${r.igst ? ` (IGST)` : ` (CGST ₹${money(r.cgst)} + SGST ₹${money(r.sgst)})`}</p>
      <div class="grid g2">
        <label class="f" for="ga-cat">Category<select class="inp fill" id="ga-cat" data-req="1">${optList(cats, cats.find(c => /purchas|material|paper|stock/i.test(c)) || "", "Pick one")}</select></label>
        <label class="f" for="ga-vert">Vertical<select class="inp fill" id="ga-vert">${optList(L2.verticals, L2.verticals?.[0])}</select></label>
        <label class="f" for="ga-from">Paid from<select class="inp fill" id="ga-from">${optList(L2.accounts, "", "—")}</select></label>
        <label class="f" for="ga-desc">Description<input class="inp fill" id="ga-desc" value="Purchase bill ${esc(r.inum)}"></label>
      </div>
      ${!cl && !nameTaken ? `<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input type="checkbox" id="ga-client" checked> Also add ${esc(vendor)} to Clients as a supplier</label>` : ""}`,
    actions: [{label: "Cancel", value: false, cls: "ghost"}, {label: "Add expense", value: true, cls: "primary", collect: s => {
      const errs = vCheck(s); if (errs.length) return vFail(errs, s);
      return {cat: $("#ga-cat", s).value, vert: $("#ga-vert", s).value, from: $("#ga-from", s).value, desc: $("#ga-desc", s).value.trim(), client: !!$("#ga-client", s)?.checked};
    }}]});
  if (!res?.value) return;
  const f = res.data;
  write(async db => {
    await db.collection("expenses").add({date: r.date || todayISO(), vertical: f.vert, category: f.cat, vendor, gstin: r.gstin, billNo: r.inum, billDate: r.date, desc: f.desc, paidFrom: f.from,
      amount: r2(r.val), gst: rate, gstAmt: r.tax, basic: r.txval, linked: "", notes: "", src: "GSTR-2B", createdAt: new Date().toISOString()});
    if (f.client) await db.collection("clients").add({name: vendor, role: "Supplier", gstin: r.gstin, pan: r.gstin.slice(2, 12), pos: stateName(r.gstin.slice(0, 2)), address: "", contact: "", phone: "", email: "", type: L2.verticals?.[0] || "", notes: "Added from GSTR-2B"});
  }, `Added ${r.inum} from ${vendor} — matched with GSTR-2B.`);
}

<script>
"use strict";
/* =====================================================================
   CONFIG — paste the OAuth Client ID from Google Cloud here (see SETUP)
   ===================================================================== */
const CONFIG = {

};
const APP_VERSION = "14 (10 Nov 2026)";
const SCOPES = "openid email profile https://www.googleapis.com/auth/drive.file";
/* Small on-screen sync log (Google & backup screen) — helps find problems on phones */
const SYNCLOG = [];
function slog(msg, bad) {
  const d = new Date(), t = [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, "0")).join(":");
  SYNCLOG.unshift({t, msg: String(msg), bad: !!bad}); SYNCLOG.length = Math.min(SYNCLOG.length, 12);
  if (typeof S !== "undefined" && S.view === "sync") { const el = document.getElementById("synclog"); if (el) el.innerHTML = synclogHTML(); }
}
const synclogHTML = () => SYNCLOG.length ? SYNCLOG.map(x => `<div${x.bad ? ' class="bad-t"' : ""}><span class="mono">${x.t}</span> ${esc(x.msg)}</div>`).join("") : `<div class="muted">Nothing yet.</div>`;

const COLLS = ["clients", "ratecard", "docs", "payments", "expenses"];
const nowISO = () => new Date().toISOString();
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(n => [n, x[n]])) : x);

function deepMerge(a, b) {
  for (const k of Object.keys(b)) {
    if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k])) deepMerge(a[k], b[k]);

}

/* =====================================================================
   On-this-computer storage (IndexedDB, falling back to localStorage)
   ===================================================================== */
const kv = (() => {
  let dbp = null;

    const r = indexedDB.open("vd-enterprise-desk", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q.result); t.onerror = () => rej(t.error); }); };
  return {
    async get(k) { try { return await run("readonly", s => s.get(k)); } catch { return ls.get("kv:" + k, undefined); } },
    async set(k, v) { try { await run("readwrite", s => s.put(v, k)); } catch { ls.set("kv:" + k, v); } },

const blankL = () => ({email: "", settings: null, settingsU: "", coll: {clients: {}, ratecard: {}, docs: {}, payments: {}, expenses: {}}, lastSync: "", sheetId: "", photoFolder: "", lastBackup: "", dirty: false, tomb: {}});

function publish() {
  S.settings = L.settings ? mergeSettings(L.settings) : FALLBACK_SETTINGS;
  for (const c of COLLS) S[c] = Object.entries(L.coll[c]).filter(([, r]) => !r._del).map(([id, r]) => ({...r, id}));
  S.payments.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

}
const persist = debounce(async () => { if (L.email) await kv.set("state:" + L.email, clone(L)); }, 150);

S.db = {
  doc(path) {
    const [c, id] = path.split("/");
    return {
      async set(data) {
        if (c === "config") { L.settings = strip(data); L.settingsU = nowISO(); }
        else L.coll[c][id] = {...strip(data), _u: nowISO()};

      async update(data) {
        if (c === "config") { L.settings = deepMerge(clone(L.settings || FALLBACK_SETTINGS), clone(data)); L.settingsU = nowISO(); }
        else {
          const cur = L.coll[c][id];
          if (!cur || cur._del) throw new Error("that record no longer exists");

        }

      },
      async delete() { if (L.coll[c] && L.coll[c][id]) { const t = nowISO(); L.coll[c][id] = {_del: true, _u: t}; (L.tomb = L.tomb || {})[c + "/" + id] = t; touchLocal(); } }
    };

/* Files saved to this computer */
const MIME = {json: "application/json", csv: "text/csv;charset=utf-8", pdf: "application/pdf"};

  async save({filename, data}) {

    setTimeout(() => URL.revokeObjectURL(url), 5000);

  }

/* =====================================================================

const AUTH = {token: "", exp: 0, email: "", name: ""};

try { const t = JSON.parse(localStorage.getItem("vd:tok") || sessionStorage.getItem("vd:tok") || "null"); if (t && t.e > Date.now()) { AUTH.token = t.t; AUTH.exp = t.e; AUTH.email = t.m || ""; } } catch {}

async function getToken() {
  if (!clientId()) throw Object.assign(new Error("Add the Google Client ID first (Google & backup → Setup)."), {code: "setup"});
  if (!navigator.onLine) throw new Error("You're offline — connect to the internet to sign in.");
  await loadScript("https://accounts.google.com/gsi/client");
  return new Promise((resolve, reject) => {
    // Never wait for ever: phones sometimes lose the Google window without telling the page.
    let done = false;
    const tm = setTimeout(() => rej(new Error("Google sign-in didn't finish — tap Sync now to try again.")), 90 * 1000);
    function res(v) { if (done) return; done = true; clearTimeout(tm); resolve(v); }
    function rej(e) { if (done) return; done = true; clearTimeout(tm); reject(e); }

      client_id: clientId(), scope: SCOPES,
      callback: r => {
        if (r.error) return rej(new Error(r.error_description || r.error));

      error_callback: e => rej(new Error(e && e.type === "popup_closed" ? "Sign-in window was closed." : e && e.type === "popup_failed_to_open" ? "The browser blocked the Google sign-in window — allow pop-ups for this site." : "Google sign-in didn't finish."))
    };

  });
}
function rememberToken() { try { localStorage.setItem("vd:tok", JSON.stringify({t: AUTH.token, e: AUTH.exp, m: AUTH.email})); } catch {} ls.set("granted", true); }

async function gfetch(url, opts = {}) {
  if (!tokenOk()) throw Object.assign(new Error("Google sign-in has expired."), {code: "auth"});
  let r;

    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 45 * 1000);
    try { r = await fetch(url, {...opts, signal: ac.signal, headers: {Authorization: "Bearer " + AUTH.token, ...(opts.body ? {"Content-Type": "application/json"} : {})}}); }
    finally { clearTimeout(tm); }
  } catch { throw Object.assign(new Error("Couldn't reach Google — check the internet connection."), {code: "net"}); }
  if (r.status === 401) { AUTH.token = ""; throw Object.assign(new Error("Google sign-in has expired."), {code: "auth"}); }
  if (!r.ok) {
    let m = r.statusText;
    try { m = (await r.json()).error.message; } catch {}
    throw Object.assign(new Error(m || ("Google returned " + r.status)), {status: r.status});
  }
  return r.status === 204 ? null : r.json();
}

/* =====================================================================
   Google Sheet layout — one readable tab per list
   ===================================================================== */
const SPEC = {
  clients:  {tab: "Clients", cols: [["Client", "name"], ["Billing Address", "address"], ["GSTIN", "gstin"], ["Place of Supply", "pos"], ["Contact", "contact"], ["Phone", "phone"], ["Email", "email"], ["Type", "type"], ["Notes", "notes"], ["PAN", "pan"], ["Customer / Supplier", "role"]]},
  ratecard: {tab: "Rate Card", cols: [["Item", "item"], ["Category", "category"], ["HSN/SAC", "hsn"], ["Unit", "unit"], ["Rate", "rate", "n"], ["Cost", "cost", "n?"], ["GST Rate", "gst", "n"], ["Times Sold", "sold", "n"], ["Last Sold", "lastSold"], ["Lowest", "low", "n?"], ["Highest", "high", "n?"]]},
  docs:     {tab: "Documents", json: true, cols: [["Doc No.", "no"], ["Document", "type"], ["GST / Non-GST", "docType"], ["Date", "date"], ["Client", "client"], ["What it's for", "summary"], ["Taxable", "taxable", "n"], ["GST", "gstAmt", "n"], ["Total", "total", "n"], ["Status", "status"], ["Converted To", "converted"], ["Follow-up On", "followUp"], ["Notes", "notes"], ["Source", "source"], ["Kind", "kind"]]},
  payments: {tab: "Payments", cols: [["Date", "date"], ["Received / Paid", "dir"], ["Against Doc No.", "against"], ["Client / Party", "party"], ["Amount", "amount", "n"], ["Mode", "mode"], ["Account", "account"], ["Ref / UTR", "ref"], ["Notes", "notes"], ["Created", "createdAt"]]},
  expenses: {tab: "Expenses", cols: [["Date", "date"], ["Vertical", "vertical"], ["Category", "category"], ["Paid To", "vendor"], ["Description", "desc"], ["Paid From", "paidFrom"], ["Amount (incl. GST)", "amount", "n"], ["GST Rate", "gst", "n"], ["GST Amount", "gstAmt", "n"], ["Basic Amount", "basic", "n"], ["Linked Job", "linked"], ["Bill No.", "billNo"], ["Notes", "notes"], ["Created", "createdAt"], ["Supplier GSTIN", "gstin"], ["Bill Date", "billDate"], ["Added From", "src"]]},
};
const TABS = ["Settings", ...COLLS.map(c => SPEC[c].tab)];
const q1 = t => `'${t.replace(/'/g, "''")}'`;
const headerOf = c => ["ID", ...SPEC[c].cols.map(x => x[0]), "Last Changed", ...(SPEC[c].json ? ["App Details (don't edit)"] : [])];

function toRow(c, id, r) {
  const sp = SPEC[c];
  const cells = sp.cols.map(([, f, k]) => r[f] === undefined ? "" : k === "n?" ? (r[f] == null || r[f] === "" ? "" : num(r[f])) : k === "n" ? num(r[f]) : String(r[f] ?? ""));
  const row = [id, ...cells, r._u || ""];
  if (sp.json) { const rest = {...r}; for (const [, f] of sp.cols) delete rest[f]; delete rest._u; row.push(JSON.stringify(rest)); }
  return row;
}
function fromRow(c, header, row) {
  const sp = SPEC[c], at = n => { const i = header.indexOf(n); return i < 0 ? "" : row[i] ?? ""; };
  let rec = {};
  if (sp.json) { try { rec = JSON.parse(at(headerOf(c).at(-1)) || "{}"); } catch { rec = {}; } }
  for (const [h, f, k] of sp.cols) {
    const v = at(h);
    if (v === "" && sp.json && !(f in rec)) continue;
    if (k === "n?") rec[f] = v === "" ? null : num(v);
    else if (k === "n") rec[f] = v === "" ? 0 : num(v);
    else rec[f] = String(v);
  }
  rec._u = String(at("Last Changed") || "");
  return {id: String(at("ID") || "").trim(), rec};
}

async function ensureSheet() {
  const meta = async () => gfetch(`${SHEETS}/${L.sheetId}?fields=sheets.properties.title`);
  if (L.sheetId) {
    try { return await ensureTabs(await meta()); }
    catch (e) { if (e.status === 404 || e.status === 403) L.sheetId = ""; else throw e; }
  }
  const q = encodeURIComponent(`name='${CONFIG.SHEET_NAME.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const f = await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime%20desc&fields=files(id)&spaces=drive`);
  if (f.files && f.files.length) { L.sheetId = f.files[0].id; persist(); return ensureTabs(await meta()); }
  const made = await gfetch(SHEETS, {method: "POST", body: JSON.stringify({
    properties: {title: CONFIG.SHEET_NAME},
    sheets: TABS.map(t => ({properties: {title: t, gridProperties: {frozenRowCount: 1}}}))
  })});
  L.sheetId = made.spreadsheetId; persist();
}
async function ensureTabs(m) {
  const have = new Set((m.sheets || []).map(s => s.properties.title));
  const need = TABS.filter(t => !have.has(t));
  if (need.length) await gfetch(`${SHEETS}/${L.sheetId}:batchUpdate`, {method: "POST", body: JSON.stringify({requests: need.map(t => ({addSheet: {properties: {title: t, gridProperties: {frozenRowCount: 1}}}}))})});
}
async function readAll() {
  const qs = TABS.map(t => "ranges=" + encodeURIComponent(q1(t) + "!A1:Z")).join("&");
  const res = await gfetch(`${SHEETS}/${L.sheetId}/values:batchGet?${qs}&valueRenderOption=UNFORMATTED_VALUE`);
  const vr = res.valueRanges || [];
  const out = {settings: null, settingsU: "", coll: {}, empty: {}, needIds: false};
  const srows = vr[0]?.values || [];
  const sm = Object.fromEntries(srows.slice(1).map(r => [r[0], r[1]]));
  if (sm.company) {
    try { out.settings = {company: JSON.parse(sm.company), defaults: JSON.parse(sm.defaults || "{}"), series: JSON.parse(sm.series || "{}"), lists: JSON.parse(sm.lists || "{}")}; out.settingsU = String(sm.updatedAt || ""); } catch { out.settings = null; }
  }
  try { out.tomb = sm.deleted ? JSON.parse(sm.deleted) : {}; } catch { out.tomb = {}; }
  COLLS.forEach((c, i) => {
    const rows = vr[i + 1]?.values || [];
    out.coll[c] = {}; out.empty[c] = rows.length <= 1;
    const header = (rows[0] || []).map(String);
    for (const row of rows.slice(1)) {
      if (!row.some(v => v !== "" && v != null)) continue;
      let {id, rec} = fromRow(c, header, row);
      if (!id) { id = newId(); out.needIds = true; }
      out.coll[c][id] = rec;
    }
  });
  return out;
}
async function writeAll() {
  const st = L.settings || FALLBACK_SETTINGS;
  const data = [{range: q1("Settings") + "!A1", values: [
    ["Key", "Value (managed by the app — change these on the app's Settings screen)"],
    ["company", JSON.stringify(st.company)], ["defaults", JSON.stringify(st.defaults)], ["series", JSON.stringify(st.series)], ["lists", JSON.stringify(st.lists)], ["updatedAt", L.settingsU || ""],
    ["deleted", JSON.stringify(L.tomb || {})]
  ]}];
  const tails = [q1("Settings") + "!A8:Z"];
  for (const c of COLLS) {
    const rows = Object.entries(L.coll[c]).filter(([, r]) => !r._del).sort((a, b) => (a[1].date || a[1].name || a[1].item || "").localeCompare(b[1].date || b[1].name || b[1].item || "")).map(([id, r]) => toRow(c, id, r));
    data.push({range: q1(SPEC[c].tab) + "!A1", values: [headerOf(c), ...rows]});
    tails.push(`${q1(SPEC[c].tab)}!A${rows.length + 2}:Z`);
  }
  await gfetch(`${SHEETS}/${L.sheetId}/values:batchUpdate`, {method: "POST", body: JSON.stringify({valueInputOption: "RAW", data})});
  await gfetch(`${SHEETS}/${L.sheetId}/values:batchClear`, {method: "POST", body: JSON.stringify({ranges: tails})});
}

/* =====================================================================
   Sync: this computer ⇄ Google Sheet (newest change wins, per record)
   ===================================================================== */
let syncing = null, syncAgain = false;
function setSync(state, msg = "") {
  const was = S.sync.state; S.sync = {state, msg, at: Date.now()}; renderRail();
  if (S.view === "sync") render();
  else if ((state === "error") !== (was === "error") && S.view !== "editor") render();
}
async function sync(interactive) {
  if (interactive && L.email && clientId() && navigator.onLine && !tokenOk()) {
    setSync("connecting"); slog("Opening Google sign-in…");
    try { await getToken(); rememberToken(); slog("Google sign-in OK"); }
    catch (e) { setSync(e.code === "setup" ? "setup" : "signin"); slog("Sign-in: " + (e.message || "didn't finish"), true); toast(e.message || "Google sign-in didn't finish.", true); return; }
  }
  return syncLocked(interactive);
}
function syncLocked(interactive) {
  if (syncing) { syncAgain = true; if (interactive) slog("A sync is already running — it will repeat when done"); return syncing; }
  syncing = (async () => {
    await null;   // let "syncing" be set before this can finish — otherwise a sync with nothing to do left the lock on for ever
    try {
      if (!L.email) return;
      if (!clientId()) return setSync("setup");
      if (!navigator.onLine) { slog("Offline", true); return setSync("offline"); }
      if (!tokenOk()) { if (interactive) slog("Not signed in to Google", true); return setSync("signin"); }
      setSync("syncing"); slog("Sync started");
      const started = nowISO();
      await ensureSheet();
      const R = await readAll();
      slog("Read Google Sheet: " + COLLS.map(c => Object.keys(R.coll[c]).length).reduce((a, b) => a + b, 0) + " records");
      let push = R.needIds, pulled = 0;
      if (R.settings && (!L.settings || R.settingsU >= (L.settingsU || ""))) {
        const localSeries = clone(L.settings?.series || {});
        if (stable(R.settings) !== stable(L.settings)) { L.settings = R.settings; L.settingsU = R.settingsU; pulled++; }
        for (const t of Object.keys(TYPES)) {
          const a = num(localSeries[t]?.next), s = L.settings.series[t];
          if (s && a > num(s.next)) { s.next = a; push = true; }
        }
      } else if (L.settings) {
        push = true;
        for (const t of Object.keys(TYPES)) {
          const b = num(R.settings?.series?.[t]?.next), s = L.settings.series?.[t];
          if (s && b > num(s.next)) { s.next = b; pulled++; }
        }
      }
      // Deleted records (from any device) — so a delete can't be undone by another device's old copy
      const tomb = {...(R.tomb || {})};
      for (const [k, t] of Object.entries(L.tomb || {})) { if (!tomb[k] || t > tomb[k]) { tomb[k] = t; push = true; } }
      const cutoff = new Date(Date.now() - 180 * 864e5).toISOString();
      for (const [k, t] of Object.entries(tomb)) {
        const [c, ...rest] = k.split("/"), id = rest.join("/");
        if (!L.coll[c]) { delete tomb[k]; continue; }
        const l = L.coll[c][id], r = R.coll[c][id];
        if (r && (r._u || "") > t) { delete tomb[k]; push = true; continue; }          // made again after the delete
        if (l && !l._del && (l._u || "") > t) { delete tomb[k]; push = true; continue; }
        if (r) { delete R.coll[c][id]; push = true; }                                     // still in the Sheet → take it out
        if (l) { if (!l._del) pulled++; delete L.coll[c][id]; }                            // deleted on another device
        if (t < cutoff) { delete tomb[k]; push = true; }
      }
      L.tomb = tomb;
      for (const c of COLLS) {
        const loc = L.coll[c], rem = R.coll[c];
        for (const id of new Set([...Object.keys(loc), ...Object.keys(rem)])) {
          const l = loc[id], r = rem[id];
          if (l && !r) {
            if (l._del) delete loc[id];
            else if (R.empty[c] || !L.lastSync || (l._u || "") > L.lastSync) push = true;
            else { delete loc[id]; pulled++; }            // removed from the Sheet
          } else if (!l && r) { loc[id] = r; pulled++; }
          else if ((l._u || "") > (r._u || "")) push = true;
          else if (stable(l) !== stable(r)) { loc[id] = r; pulled++; }
        }
      }
      try { if (await photoSync()) push = true; }
      catch (e) { if (e.code === "auth" || e.code === "net") throw e; console.warn("Photo sync:", e); toast("Photos couldn't be copied to Google Drive this time: " + (e.message || "unknown error"), true); }
      if (push) await writeAll();
      try { L.remoteMod = (await gfetch(`${DRIVE}/${L.sheetId}?fields=modifiedTime`)).modifiedTime || ""; } catch {}
      for (const c of COLLS) for (const [id, r] of Object.entries(L.coll[c])) if (r._del) delete L.coll[c][id];
      L.lastSync = started; L.dirty = false;
      persist();
      if (pulled) publish();
      slog(`Sync done — ${pulled} change${pulled === 1 ? "" : "s"} received${push ? ", this device's changes sent" : ""}`);
      setSync("ok");
    } catch (e) {
      slog("Sync problem: " + (e.message || e), true);
      if (e.code === "auth") { AUTH.token = ""; setSync("signin"); }
      else if (e.code === "net") setSync("offline");
      else setSync("error", e.message || "Sync failed.");
      if (interactive || (e.code !== "auth" && e.code !== "net")) toast("Google sync: " + (e.message || "failed"), true);
    } finally {
      syncing = null;
      if (syncAgain) { syncAgain = false; setTimeout(() => syncLocked(false), 600); }
    }
  })();
  return syncing;
}

/* Photos ⇄ Google Drive folder "VD Enterprise Desk Photos" */
const DRIVE = "https://www.googleapis.com/drive/v3/files";
const PHOTO_FOLDER = "VD Enterprise Desk Photos";
async function photoFolder() {
  if (L.photoFolder) return L.photoFolder;
  const q = encodeURIComponent(`name='${PHOTO_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const f = await gfetch(`${DRIVE}?q=${q}&fields=files(id)&spaces=drive`);
  L.photoFolder = f.files && f.files.length ? f.files[0].id
    : (await gfetch(`${DRIVE}?fields=id`, {method: "POST", body: JSON.stringify({name: PHOTO_FOLDER, mimeType: "application/vnd.google-apps.folder"})})).id;
  persist();
  return L.photoFolder;
}
async function driveUpload(name, dataURL, folder) {
  const jpeg = await (await fetch(dataURL)).blob();
  const bnd = "vdb" + newId();
  const body = new Blob([`--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name, mimeType: "image/jpeg", parents: [folder]})}\r\n--${bnd}\r\nContent-Type: image/jpeg\r\n\r\n`, jpeg, `\r\n--${bnd}--`]);
  let r;
  try { r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method: "POST", headers: {Authorization: "Bearer " + AUTH.token, "Content-Type": `multipart/related; boundary=${bnd}`}, body}); }
  catch { throw Object.assign(new Error("Couldn't reach Google — check the internet connection."), {code: "net"}); }
  if (r.status === 401) { AUTH.token = ""; throw Object.assign(new Error("Google sign-in has expired."), {code: "auth"}); }
  if (!r.ok) { let m = "upload failed (" + r.status + ")"; try { m = (await r.json()).error.message; } catch {} throw new Error(m); }
  return (await r.json()).id;
}
async function driveDownload(fileId) {
  const r = await fetch(`${DRIVE}/${encodeURIComponent(fileId)}?alt=media`, {headers: {Authorization: "Bearer " + AUTH.token}});
  if (r.status === 401) { AUTH.token = ""; return ""; }
  if (!r.ok) return "";
  const blob = await r.blob();
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}
async function photoSync() {
  let uploaded = 0, touched = 0;
  const docs = Object.entries(L.coll.docs).filter(([, r]) => r && !r._del && Array.isArray(r.photos) && r.photos.length);
  // 1. send photos that only exist on this device
  for (const [id, r] of docs) {
    let changed = false;
    for (const p of r.photos) {
      if (p.f) continue;
      const known = photoFileOf(p.id);
      if (known) { p.f = known; changed = true; continue; }
      const u = S.img[p.id] || await kv.get("img:" + p.id);
      if (!u) continue;
      p.f = await driveUpload(`${r.no || id} - ${p.id}.jpg`, u, await photoFolder());
      changed = true; uploaded++;
    }
    if (changed) { r._u = nowISO(); touched++; }
  }
  if (uploaded || docs.length) {
    for (const t in S.drafts) for (const p of S.drafts[t].photos || []) if (!p.f) p.f = photoFileOf(p.id);
    persistDraft();
  }
  // 2. fetch photos added on another device
  for (const [, r] of docs) for (const p of r.photos) {
    if (!p.f || S.img[p.id] || await kv.get("img:" + p.id)) continue;
    const u = await driveDownload(p.f);
    if (u) { await kv.set("img:" + p.id, u); S.img[p.id] = u; }
  }
  if (touched) persist();
  return touched > 0;
}

function ago(iso) {
  if (!iso) return "never";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  return fmtDate(iso.slice(0, 10));
}

async function importFile(file) {

  if (!obj || obj.app !== "vd-enterprise-desk" || !obj.coll) return toast("That file isn't a VD Enterprise backup.", true);
  const counts = COLLS.map(c => Object.keys(obj.coll[c] || {}).length);
  if (!(await confirmBox("Load this file?", `${esc(file.name)} has ${counts[0]} clients, ${counts[1]} rate card items, ${counts[2]} documents, ${counts[3]} payments and ${counts[4]} expenses. Anything missing on this computer is added back; records you changed here more recently are kept.`, "Load it"))) return;
  const now = nowISO();
  if (obj.settings && (!L.settings || (obj.settingsU || "") > (L.settingsU || ""))) { L.settings = obj.settings; L.settingsU = obj.settingsU || now; }
  let added = 0;

}
$("#file-import").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importFile(f); });
async function exportExcel() {

  const X = window.XLSX, wb = X.utils.book_new();
  const add = (name, rows) => X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length ? rows : [{"": "No records"}]), name);
  add("Quotations", quotes().map(q => ({"Quote No.": q.no, Date: q.date, Client: q.client, Vertical: q.vertical, "What it's for": q.summary, "Taxable ₹": q.taxable, "GST ₹": q.gstAmt, "Total ₹": q.total, "Valid Until": q.validUntil, Status: q.status, "Converted to Invoice": q.converted, "Follow-up On": q.followUp, Notes: q.notes, "Doc Type": q.docType})));
  add("Invoices", invoices().map(i => ({"Invoice No.": i.no, Date: i.date, Client: i.client, "Client PO No.": i.poNo || "", "PO Date": i.poDate || "", Vertical: i.vertical, "What it's for": i.summary, "Taxable ₹": i.taxable, "GST ₹": i.gstAmt, "Total ₹": i.total, "Cost ₹": i.cost, "Margin ₹": i.margin, "Received ₹": i.received, "Balance ₹": i.balance, "Due Date": i.due, Status: i.status, "Days Overdue": i.overdue, Notes: i.notes, "Doc Type": i.docType})));
  add("Payments", S.payments.map(p => ({Date: p.date, "Received / Paid": p.dir, "Against Doc No.": p.against, "Client / Party": p.party, "Amount ₹": p.amount, Mode: p.mode, Account: p.account, "Ref / UTR": p.ref, Notes: p.notes})));
  add("Expenses", S.expenses.map(x => ({Date: x.date, Vertical: x.vertical, Category: x.category, "Paid To": x.vendor, "Supplier GSTIN": expGstin(x), "Bill Date": x.billDate || "", Description: x.desc, "Paid From": x.paidFrom, "Amount ₹ (incl. GST)": x.amount, "GST %": num(x.gst) * 100, "GST ₹": x.gstAmt, "Basic ₹": x.basic, "Linked Job": x.linked, "Bill No.": x.billNo, Notes: x.notes})));
  add("Clients", S.clients.map(c => ({Client: c.name, "Customer / Supplier": c.role || "Customer", "Billing Address": c.address, GSTIN: c.gstin, PAN: c.pan || "", "Place of Supply": c.pos, Contact: c.contact, Mobile: c.phone, Email: c.email, Type: c.type, Notes: c.notes})));
  add("Rate Card", S.ratecard.map(r => ({Item: r.item, Category: r.category, "HSN/SAC": r.hsn, Unit: r.unit, "Rate ₹": r.rate, "Cost ₹": r.cost ?? "", "GST %": num(r.gst) * 100, "Times Sold": r.sold, "Last Sold": r.lastSold, "Lowest ₹": r.low ?? "", "Highest ₹": r.high ?? ""})));
  add("Rate History", S.idx.lines.map(l => ({Date: l.date, Client: l.client, "Doc No.": l.no, Item: l.desc, HSN: l.hsn, Qty: l.qty, Unit: l.unit, "Rate ₹": l.rate, "Amount ₹": l.amount})));
  X.writeFile(wb, `VD Enterprise records ${todayISO()}.xlsx`);
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-import]")) { e.preventDefault(); $("#file-import").click(); }
  else if (e.target.closest("[data-syncnow]")) { e.preventDefault(); sync(true); }
  else if (e.target.closest("[data-signin]")) { e.preventDefault(); signIn(); }
});

/* =====================================================================
   GOOGLE & BACKUP screen
   ===================================================================== */
VIEWS.sync = () => {
  const signed = tokenOk(), n = c => Object.values(L.coll[c]).filter(r => !r._del).length;
  const backupAge = L.lastBackup ? Math.floor((Date.now() - Date.parse(L.lastBackup)) / 864e5) : null;
  const G = `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>`;
  return `
  <div class="head"><div><div class="eyebrow">Where your records live</div><h1>Google &amp; backup</h1><p>Every change is saved on this computer first, so the app keeps working without internet. When you're signed in, it's copied to the Google Sheet “${esc(CONFIG.SHEET_NAME)}” in your own Google Drive.</p></div></div>
  <div class="grid g2">
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0">Google account</h2>
      ${L.email ? (AUTH.name ? `<div><b>${esc(AUTH.name)}</b><div class="muted">${esc(L.email)}</div></div>` : `<div><b>${esc(L.email)}</b></div>`) : `<p class="muted" style="margin:0">Not signed in.</p>`}
      <div class="kvlist" style="display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px">
        <span class="muted">Status</span><span>${esc({ok: "Up to date", syncing: "Syncing…", connecting: "Waiting for the Google sign-in window…", signin: "Sign in to sync", offline: "Offline — will sync when back online", error: "Problem: " + S.sync.msg, setup: "Add the Google Client ID below", idle: "Waiting"}[S.sync.state] || "")}</span>
        <span class="muted">Last synced</span><span>${esc(ago(L.lastSync))}</span>
        <span class="muted">Google Sheet</span><span>${L.sheetId ? `<a href="https://docs.google.com/spreadsheets/d/${esc(L.sheetId)}/edit" target="_blank" rel="noopener">Open “${esc(CONFIG.SHEET_NAME)}” ↗</a>` : "Created on first sync"}</span>
      </div>
      <div class="row">
        ${signed ? `<button class="btn primary" data-syncnow>Sync now</button><button class="btn ghost" id="sg-out">Sign out</button>`
                 : `<button class="gbtn" data-signin>${G}Sign in with Google</button>`}
      </div>
      <details ${SYNCLOG.some(x => x.bad) ? "open" : ""}><summary class="muted" style="cursor:pointer;font-size:13px">Sync details · app version ${esc(APP_VERSION)}</summary>
        <div id="synclog" style="font-size:12.5px;display:grid;gap:2px;margin-top:6px">${synclogHTML()}</div></details>
      <p class="muted" style="margin:0;font-size:13px">You can read the Sheet or give it to your CA. Change records in the app — edits typed straight into the Sheet are picked up on the next sync, but leave the ID, Last Changed and App Details columns alone.</p>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0">On this computer</h2>
      <p style="margin:0">${n("clients")} clients · ${n("ratecard")} rate card items · ${n("docs")} documents · ${n("payments")} payments · ${n("expenses")} expenses</p>
      <p style="margin:0" class="${backupAge == null || backupAge > 7 ? "bad-t" : "muted"}">Last backup file: ${L.lastBackup ? esc(ago(L.lastBackup)) : "never"}${backupAge == null || backupAge > 7 ? " — download one now and keep it somewhere safe" : ""}</p>
      <div class="row">
        <button class="btn primary" id="sg-backup">Download backup</button>
        <button class="btn" id="sg-xlsx">Export to Excel</button>
        <button class="btn" data-import>Restore / import a file</button>
      </div>
      <p class="muted" style="margin:0;font-size:13px">The backup (.json) holds everything and can be loaded back here with Restore. The Excel file is for reading, printing or sending to your CA.</p>

  <div class="card">
    <details class="setup" ${clientId() ? "" : "open"}>
      <summary>Setup &amp; this computer's data</summary>
      <div class="grid" style="gap:12px">
        <label class="f" for="sg-client">Google OAuth Client ID ${CONFIG.GOOGLE_CLIENT_ID ? "(set in the app file)" : "(saved in this browser only)"}
          <input class="inp mono" id="sg-client" value="${esc(clientId())}" placeholder="1234567890-xxxx.apps.googleusercontent.com" ${CONFIG.GOOGLE_CLIENT_ID ? "readonly" : ""}></label>
        ${CONFIG.GOOGLE_CLIENT_ID ? "" : `<div class="row"><button class="btn" id="sg-client-save">Save Client ID</button><span class="muted" style="font-size:13px">Better: paste it into CONFIG at the top of the last script in index.html, so every computer gets it. The SETUP guide explains how to create one.</span></div>`}
        <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost danger" id="sg-wipe">Remove this account's data from this computer…</button><span class="muted" style="font-size:13px">Your Google Sheet is not touched.</span></div>
      </div>
    </details>
  </div>`;
};
AFTER.sync = () => {
  $("#sg-out")?.addEventListener("click", signOut);
  $("#sg-backup").addEventListener("click", downloadBackup);
  $("#sg-xlsx").addEventListener("click", exportExcel);
  $("#sg-client-save")?.addEventListener("click", () => {
    const v = $("#sg-client").value.trim();
    if (v && !/\.apps\.googleusercontent\.com$/.test(v)) return toast("A Client ID ends with .apps.googleusercontent.com", true);
    ls.set("clientId", v); toast(v ? "Client ID saved. Now sign in." : "Client ID removed."); setSync(v ? "signin" : "setup");
  });
  $("#sg-wipe").addEventListener("click", async () => {
    const unsynced = L.dirty ? " Some changes haven't reached Google yet and would be lost." : "";
    if (!(await confirmBox("Remove data from this computer?", `This deletes ${esc(L.email || "this account")}'s records from this browser.${unsynced} Download a backup first if unsure.`, "Remove", true))) return;
    await kv.del("state:" + L.email);
    ls.set("lastEmail", ""); ls.set("signedOut", true);
    Object.assign(L, blankL()); publish();
    AUTH.token = ""; try { sessionStorage.removeItem("vd:tok"); } catch {}
    showGate(true);
  });
};

/* Settings text tweak for this edition */
const _settingsView = VIEWS.settings;
VIEWS.settings = () => _settingsView().replace("Changes apply for everyone using this page.", "Changes are saved on this computer and synced to your Google Sheet.");

/* =====================================================================
   First screen (sign-in)
   ===================================================================== */
async function showGate(on) {
  const g = $("#gate");
  g.hidden = !on;
  if (!on) return;
  const last = ls.get("lastEmail", "");
  const hasLocal = last ? !!(await kv.get("state:" + last)) : false;
  g.innerHTML = `<div class="gate-card">
    <div class="letter"><img src="${LOGO}" alt="VD Enterprise letterhead"></div>
    <div><div class="eyebrow">VD Enterprise Desk</div><h1>Quotes, invoices &amp; accounts</h1></div>
    <p>Sign in with the Google account that should own the records.</p>
    <ul class="facts">
      <li><span>Everything is saved on this computer, so it keeps working without internet.</span></li>
      <li><span>A copy is kept in a Google Sheet in <b>your own</b> Google Drive, so another computer can pick up where you left off.</span></li>
      <li><span>The app only gets access to the files it creates, nothing else in your Drive.</span></li>
    </ul>
    ${clientId() ? `<button class="gbtn" data-signin style="align-self:flex-start"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>`
      : `<div class="banner">This copy of the app doesn't have its Google Client ID yet. Paste it below (or into index.html — see SETUP).</div>
         <div class="row"><input class="inp mono" id="gate-client" placeholder="1234567890-xxxx.apps.googleusercontent.com" style="flex:1;min-width:220px"><button class="btn primary" id="gate-client-save">Save</button></div>`}
    ${hasLocal ? `<button class="btn ghost" id="gate-local" style="align-self:flex-start">Continue offline with ${esc(last)}'s data on this computer</button>` : ""}
    ${location.protocol === "file:" ? `<p class="bad-t" style="margin:0;font-size:13px">Opened as a file — Google sign-in only works when the app is opened from its web address (or http://localhost). See SETUP.</p>` : ""}
  </div>`;
  $("#gate-client-save")?.addEventListener("click", () => {
    const v = $("#gate-client").value.trim();
    if (!/\.apps\.googleusercontent\.com$/.test(v)) return toast("A Client ID ends with .apps.googleusercontent.com", true);
    ls.set("clientId", v); showGate(true);
  });
  $("#gate-local")?.addEventListener("click", async () => {
    const st = await kv.get("state:" + last);
    Object.assign(L, blankL(), st || {}, {email: last}); publish();
    ls.set("signedOut", false); showGate(false); renderRail(); render(); setSync("signin");
  });
}

/* =====================================================================
   Boot
   ===================================================================== */
(async function boot() {
  const v = ls.get("view", "home");
  if (TYPES[v]) { S.view = "editor"; S.edType = v; try { freshIfSaved(v); } catch {} } else S.view = VIEWS[v] ? v : "home";
  renderRail(); render();
  const last = ls.get("lastEmail", "");
  const st = last ? await kv.get("state:" + last) : null;
  if (st && !ls.get("signedOut", false)) {
    Object.assign(L, blankL(), st, {email: last});
    for (const c of COLLS) L.coll[c] = L.coll[c] || {};
    if (AUTH.email && AUTH.email !== last) { AUTH.token = ""; }
    publish(); renderRail(); render();
    sync(false);
  } else showGate(true);
  setInterval(() => sync(false), 3 * 60 * 1000);
  setInterval(checkRemote, 20 * 1000);
  setInterval(() => renderRail(), 60 * 1000);
  window.addEventListener("online", () => sync(false));
  window.addEventListener("offline", () => setSync("offline"));
  let lastFocus = 0;
  window.addEventListener("focus", () => { if (Date.now() - lastFocus > 60000) { lastFocus = Date.now(); sync(false); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastFocus > 30000) { lastFocus = Date.now(); sync(false); } });
  if (clientId() && navigator.onLine && /^https?:$/.test(location.protocol)) loadScript("https://accounts.google.com/gsi/client").catch(() => {});
  // Google sign-in lasts ~1 hour. When it has run out, the next tap anywhere quietly renews it
  // (Google needs a tap to open its sign-in window), then syncs.
  let lastAuto = 0;
  document.addEventListener("click", e => {
    if (tokenOk() || !navigator.onLine || !clientId() || !L.email || !ls.get("granted", false) || ls.get("signedOut", false)) return;
    if (e.target.closest("[data-signin],[data-syncnow],#gate,input,select,textarea,label")) return;
    if (Date.now() - lastAuto < 60 * 1000) return;
    lastAuto = Date.now();
    getToken().then(() => { rememberToken(); return sync(false); }).catch(() => {});
  }, true);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.VD = {importObject: async obj => { const f = new File([JSON.stringify(obj)], "data.json"); return importFile(f); }, L};
})();
</script>
